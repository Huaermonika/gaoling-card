nsparent);\n  border-radius: calc(var(--radius) + 8px);\n  box-shadow:\n    0 24px 64px -28px color-mix(in srgb, var(--accent) 45%, transparent),\n    0 6px 20px -12px color-mix(in srgb, var(--text) 25%, transparent);\n  /* 与手机壳 PC 形态一致的封顶高度：终端/设置内容超出时内部滚动，而非整卡无限撑高 */\n  max-height: 820px;\n  overflow: hidden;\n}\n\n.card-rule {\n  height: 1px;\n  border: none;\n  margin: 0;\n  background: linear-gradient(\n    90deg,\n    transparent,\n    color-mix(in srgb, var(--line-2) 65%, transparent) 18%,\n    color-mix(in srgb, var(--line-2) 65%, transparent) 82%,\n    transparent\n  );\n  flex-shrink: 0;\n}\n\n/* ===== 视图内容区 ===== */\n.console-view {\n  flex: 1;\n  min-height: 0;\n  min-width: 0;\n  display: flex;\n  flex-direction: column;\n  padding: 12px 16px;\n}\n\n.view-chat {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.view-term {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n}\n\n.view-settings {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n}\n\n/* SettingsPanel 的样式在 App.vue 里是按 scoped 写的，操作台引用时命中不到；\n   这里补一份同规格的滚动容器，卡片高度封顶后设置页可以内部滚动 */\n.settings-view {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  padding: 20px 18px 38px;\n  display: flex;\n  flex-direction: column;\n  gap: 24px;\n}\n\n/* ===== 终端视图：六面板 + 底部一行内部子菜单（样式与手机壳控制终端一致） ===== */\n.app-panel {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  padding: 14px 16px 34px;\n  background: var(--panel);\n}\n\n.app-tabs {\n  display: grid;\n  grid-template-columns: repeat(6, 1fr);\n  border-top: 1px solid var(--line);\n  background: color-mix(in srgb, var(--bg-2) 82%, transparent);\n  padding-top: 2px;\n}\n\n.app-tab {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 3px;\n  padding: 9px 0 9px;\n  background: transparent;\n  border: none;\n  color: var(--muted);\n  cursor: pointer;\n  transition: color 0.2s;\n  font-family: inherit;\n  position: relative;\n}\n\n.app-tab::before {\n  content: \'\';\n  position: absolute;\n  top: -2px;\n  left: 30%;\n  right: 30%;\n  height: 2px;\n  border-radius: 2px;\n  background: var(--accent);\n  opacity: 0;\n  transition: opacity 0.2s;\n}\n\n.app-tab:hover {\n  color: var(--text);\n}\n\n.app-tab.active {\n  color: var(--accent);\n}\n\n.app-tab.active::before {\n  opacity: 1;\n}\n\n.tab-icon {\n  font-size: 14px;\n  line-height: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n/* 图标由 v-html 注入，没有 scope 属性，必须用 :deep 才能命中 */\n.tab-icon :deep(svg) {\n  width: 14px;\n  height: 14px;\n  display: block;\n}\n\n.tab-label {\n  font-size: 10.5px;\n  letter-spacing: 1px;\n}\n\n/* ===== 底部导航：对话 / 终端 / 设置 ===== */\n.console-nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-around;\n  padding: 8px 16px 10px;\n  background: color-mix(in srgb, var(--panel-2) 55%, transparent);\n  border-top: 1px solid color-mix(in srgb, var(--line) 75%, transparent);\n  flex-shrink: 0;\n}\n\n.nav-btn {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 2px;\n  background: none;\n  border: none;\n  cursor: pointer;\n  font-family: var(--font-ui);\n  font-size: 9.5px;\n  color: var(--muted);\n  padding: 4px 14px;\n  border-radius: 12px;\n  transition: color 0.2s ease;\n}\n\n.nav-btn svg {\n  width: 17px;\n  height: 17px;\n}\n\n.nav-btn.active {\n  color: var(--accent);\n}\n\n.nav-center {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 2px;\n}\n\n.nav-center-btn {\n  width: 40px;\n  height: 40px;\n  border-radius: 50%;\n  cursor: pointer;\n  border: none;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: #fff;\n  font-size: 17px;\n  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 72%, var(--purple)));\n  box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent) 70%, transparent);\n  transition: transform 0.15s ease;\n}\n\n.nav-center-btn:hover {\n  transform: translateY(-1px);\n