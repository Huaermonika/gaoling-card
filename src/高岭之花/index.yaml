i: system-ui, -apple-system, \'Segoe UI\', \'Microsoft YaHei\', \'PingFang SC\', sans-serif;\n  --font-mono: \'JetBrains Mono\', \'Cascadia Code\', \'Courier New\', monospace;\n\n  position: relative;\n  width: 100%;\n  max-width: var(--phone-maxw, 440px);\n  margin: 0 auto;\n  min-height: var(--phone-minh, 560px);\n  max-height: min(var(--phone-maxh, 920px), 95vh);\n  zoom: var(--ui-zoom, 1);\n  background: var(--bg);\n  border: 1px solid var(--line-2);\n  border-radius: calc(var(--radius) + 8px);\n  box-shadow: var(--shadow);\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  font-family: var(--font-ui);\n  color: var(--text);\n  transition: background 0.35s ease, color 0.35s ease;\n}\n\n/* PC 形态：铺满宽屏，无手机壳约束。\n   高度用固定像素锁定（iframe 内 100vh 等于 iframe 自身高度，会与自动撑高脚本互相追逐，导致首屏塌缩成 1cm 或无限拉长），\n   内部面板各自滚动。 */\n.phone.desktop {\n  max-width: 100%;\n  height: 820px;\n  max-height: none;\n  min-height: 0;\n  border-radius: 0;\n  border: none;\n  box-shadow: none;\n}\n\n/* ===== 氛围光斑 ===== */\n.phone-deco {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  overflow: hidden;\n  z-index: 0;\n}\n\n.deco-blob {\n  position: absolute;\n  border-radius: 50%;\n  filter: blur(46px);\n  transition: background 0.35s ease;\n}\n\n.deco-a {\n  width: 230px;\n  height: 230px;\n  background: var(--deco-a);\n  top: -70px;\n  right: -60px;\n}\n\n.deco-b {\n  width: 190px;\n  height: 190px;\n  background: var(--deco-b);\n  bottom: -50px;\n  left: -50px;\n}\n\n.deco-c {\n  width: 130px;\n  height: 130px;\n  background: var(--deco-c);\n  top: 34%;\n  left: -40px;\n}\n\n/* ===== 屏幕主体 ===== */\n.phone-screen {\n  position: relative;\n  z-index: 1;\n  display: flex;\n  flex-direction: column;\n  flex: 1;\n  min-height: 0;\n}\n\n.view {\n  animation: fade-in 0.25s ease;\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  min-height: 0;\n}\n\n@keyframes fade-in {\n  from {\n    opacity: 0;\n    transform: translateY(4px);\n  }\n\n  to {\n    opacity: 1;\n    transform: translateY(0);\n  }\n}\n.status-update {\n  width: 100%;\n  padding: 10px;\n  margin-bottom: 10px;\n  background: var(--accent);\n  color: #fff;\n  border-radius: 8px;\n  font-weight: 700;\n  font-size: 13px;\n  cursor: pointer;\n  border: none;\n}\n\n.status-update:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n.chat-view {\n  display: flex;\n  flex-direction: column;\n}\n\n.chat-head {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 16px 18px 13px;\n  border-bottom: 1px solid var(--line);\n  background: color-mix(in srgb, var(--panel) 72%, transparent);\n  flex-shrink: 0;\n}\n\n.avatar {\n  position: relative;\n  width: 44px;\n  height: 44px;\n  border-radius: 50%;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  background: linear-gradient(135deg, var(--avatar-a), var(--avatar-b));\n  color: #fff;\n  font-size: 18px;\n  font-weight: 700;\n  box-shadow: 0 5px 16px color-mix(in srgb, var(--accent) 38%, transparent);\n}\n\n.avatar-char {\n  line-height: 1;\n}\n\n.avatar-img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  border-radius: inherit;\n  display: block;\n}\n\n.avatar::after {\n  content: \'\';\n  position: absolute;\n  right: -1px;\n  bottom: -1px;\n  width: 12px;\n  height: 12px;\n  border-radius: 50%;\n  background: var(--green);\n  border: 2px solid var(--panel);\n}\n\n.avatar.is-stopped::after {\n  background: var(--red);\n}\n\n.avatar.is-frozen::after {\n  background: var(--blue);\n}\n\n.chat-head-info {\n  flex: 1;\n  min-width: 0;\n}\n\n.chat-name {\n  font-size: 15px;\n  font-weight: 700;\n  letter-spacing: 1px;\n}\n\n.chat-sub {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 11px;\n  color: var(--muted);\n  margin-top: 2px;\n}\n\n.sub-dot {\n  width: 7px;\n  height: 7px;\n  border-radius: 50%;\n  background: var(--green);\n  flex-shrink: 0;\n}\n\n.sub-dot.is-stopped {\n  background: var(--red);\n}\n\n.sub-dot.is-frozen {\n  backgrou