        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 100
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量输出格式

      - 名称: ===变量结束===
        <<: *分隔符

扩展字段:
  正则:
    - 正则名称: '[隐藏]思维链'
      id: d0fb05ba-f78c-4ae4-8249-0f63ffefdee5
      启用: true
      查找表达式: /(?:\[metacognition\]|<thinking>)[\s\S]*?<\/thinking>/gi
      内容: ''
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: true

    - 正则名称: '[不发送]去除变量更新'
      id: 2d2018ae-c085-4916-af05-6830110a8293
      启用: true
      查找表达式: /<update(?:variable)?>(?:(?!.*<\/update(?:variable)?>).*$|.*<\/update(?:variable)?>)/gsi
      内容: ''
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true
      最大深度: 3

    - 正则名称: '[折叠]变量更新中'
      id: ea96523f-a1cc-4634-b9d2-f28531adca6c
      启用: true
      查找表达式: /<update(?:variable)?>(?!.*<\/update(?:variable)?>)\s*(.*)\s*$/gsi
      内容: |-

        <details>
        <summary>变量更新中{{random::.::..::...}}</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[折叠]完整变量更新'
      id: 06dec31f-c0a9-456c-8b88-1f9176a73039
      启用: true
      查找表达式: /<update(?:variable)?>\s*(.*)\s*<\/update(?:variable)?>/gsi
      内容: |-

        <details>
        <summary>变量更新情况</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[隐藏]前端状态同步'
      id: 78b34a40-cf2a-4ec5-9519-b686285a01d7
      启用: true
      查找表达式: /<ch_state_update>\s*([\s\S]*?)\s*<\/ch_state_update>/gi
      内容: |-

        <span class="ch-state-sync">⚙ 终端状态已同步</span>
      来源:
        用户输入: true
        AI输出: false
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[隐藏]写作强调'
      id: 7254a842-ff51-4067-859f-e7495ed853e9
      启用: true
      查找表达式: /<ch_writing>[\s\S]*?<\/ch_writing>/gi
      内容: ''
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[隐藏]额外提示词'
      id: 9f2c5b7e-41a8-4d63-8e07-3c6d1b9a4f52
      启用: true
      查找表达式: /<ch_extra>[\s\S]*?<\/ch_extra>/gi
      内容: ''
      来源:
        用户输入: true
        AI输出: false
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[界面]控制终端'
      id: b50d0bed-ff40-4a25-9ada-14feb4283324
      启用: false
      查找表达式: <StatusPlaceHolderImpl/>
      内容: |-
        ```
        <body>
        <script>
        $('body').load('http://localhost:5501/dist/高岭之花/界面/控制终端/index.html')
        </script>
        </body>
        ```
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

