      顺序: 350
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/机损写作指导

  - 名称: 世界观
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
