# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
# 本地模式：前端界面与变量结构脚本从 http://localhost:5501/dist/ 加载（需在项目根目录起静态服务）；mvu 脚本库走 jsdelivr 公共仓库
头像: 0CB8189DAC2085CE480FF2F587C9BEF2.png
版本: V1.6.3
作者: Urumir · 乌璐米尔
备注: |-
  高岭之花 · 白峰千鹤 的 控制终端
  仅发布于[类脑]，禁止盗用，商用，二改，转载需注名

第一条消息:
  - 文件: 第一条消息/0
  - 文件: 第一条消息/1
  - 文件: 第一条消息/2

角色描述: ''

锚点:
  - &分隔符
    启用: false
    激活策略:
      类型: 向量化
    插入位置:
      类型: 角色定义之前
      顺序: 100
    激活概率: 100
    内容: ''

世界书名称: 与角色卡名称相同
条目:
