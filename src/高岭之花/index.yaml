    插入位置:
      类型: 角色定义之后
      顺序: 100
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/角色/来源与伪装

  - 名称: 角色详情
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之后
      顺序: 600
    激活概率: 100
