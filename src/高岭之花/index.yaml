AAA,CACA,kBAAA,CAGF,0BACE,UAAA,CACA,qEAAA,CACA,YAAA,CAGF,sBACE,gBAAA,CACA,iBAAA,CACA,cAAA,CACA,eAAA,CACA,cAAA,CACA,8BAAA,CACA,mBAAA,CACA,kBAAA,CAGF,6BACE,wBAAA,CACA,uBAAA,CACA,gBAAA,CAGF,mCACE,wDAAA,CAGF,4BACE,wBAAA,CACA,0BAAA,CACA,kBAAA,CAGF,kCACE,iBAAA,CACA,yBAAA',sourcesContent:['\r\n.panel {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 10px;\r\n}\r\n\r\n.panel-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n}\r\n\r\n.panel-head.sub {\r\n  margin-top: 2px;\r\n}\r\n\r\n.panel-head-left {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n\r\n.panel-icon {\r\n  width: 24px;\r\n  height: 24px;\r\n  border-radius: 7px;\r\n  flex-shrink: 0;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  background: var(--accent-dim);\r\n  color: var(--accent);\r\n  font-size: 12px;\r\n\r\n  svg {\r\n    width: 15px;\r\n    height: 15px;\r\n    display: block;\r\n  }\r\n\r\n  &.small {\r\n    width: 20px;\r\n    height: 20px;\r\n    border-radius: 6px;\r\n    font-size: 10.5px;\r\n\r\n    svg {\r\n      width: 13px;\r\n      height: 13px;\r\n    }\r\n  }\r\n}\r\n\r\n.panel-title {\r\n  font-size: 13px;\r\n  font-weight: 700;\r\n  letter-spacing: 1px;\r\n  color: var(--text);\r\n}\r\n\r\n.panel-tag {\r\n  font-family: var(--font-mono);\r\n  font-size: 10px;\r\n  letter-spacing: 2px;\r\n  color: var(--muted);\r\n}\r\n\r\n.panel-desc {\r\n  font-size: 11.5px;\r\n  color: var(--muted);\r\n  margin-top: -6px;\r\n}\r\n\r\n/* ===== 数值修改 ===== */\r\n.sense-value {\r\n  display: flex;\r\n  align-items: baseline;\r\n  justify-content: space-between;\r\n}\r\n\r\n.sense-number {\r\n  font-family: var(--font-mono);\r\n  font-size: 32px;\r\n  font-weight: 700;\r\n  color: var(--accent);\r\n  line-height: 1;\r\n}\r\n\r\n.sense-level {\r\n  padding: 3px 12px;\r\n  border-radius: 999px;\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  border: 1px solid;\r\n\r\n  &.lv-low {\r\n    color: var(--green);\r\n    border-color: var(--green);\r\n    background: color-mix(in srgb, var(--green) 10%, transparent);\r\n  }\r\n\r\n  &.lv-mid {\r\n    color: var(--amber);\r\n    border-color: var(--amber);\r\n    background: color-mix(in srgb, var(--amber) 10%, transparent);\r\n  }\r\n\r\n  &.lv-high {\r\n    color: var(--blue);\r\n    border-color: var(--blue);\r\n    background: color-mix(in srgb, var(--blue) 10%, transparent);\r\n  }\r\n\r\n  &.lv-max {\r\n    color: var(--red);\r\n    border-color: var(--red);\r\n    background: color-mix(in srgb, var(--red) 10%, transparent);\r\n  }\r\n}\r\n\r\n.sense-slider {\r\n  width: 100%;\r\n  height: 6px;\r\n  -webkit-appearance: none;\r\n  appearance: none;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 3px;\r\n  outline: none;\r\n}\r\n\r\n.sense-slider::-webkit-slider-thumb {\r\n  -webkit-appearance: none;\r\n  appearance: none;\r\n  width: 20px;\r\n  height: 20px;\r\n  border-radius: 50%;\r\n  background: var(--accent);\r\n  border: 2px solid var(--bg);\r\n  cursor: pointer;\r\n  box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent);\r\n}\r\n\r\n.sense-slider::-moz-range-thumb {\r\n  width: 20px;\r\n  height: 20px;\r\n  border-radius: 50%;\r\n  background: var(--accent);\r\n  border: 2px solid var(--bg);\r\n  cursor: pointer;\r\n}\r\n\r\n.sense-scale {\r\n  display: flex;\r\n  justify-content: space-between;\r\n  font-family: var(--font-mono);\r\n  font-size: 10px;\r\n  color: var(--muted);\r\n  margin-top: -8px;\r\n}\r\n\r\n.sense-tip {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  font-size: 11px;\r\n  color: var(--muted);\r\n}\r\n\r\n.tip-dot {\r\n  width: 6px;\r\n  height: 6px;\r\n  border-radius: 50%;\r\n  background: var(--accent);\r\n  flex-shrink: 0;\r\n}\r\n\r\n.pleasure-actions {\r\n  display: flex;\r\n  gap: 8px;\r\n}\r\n\r\n/* ===== 身体锁定 ===== */\r\n.sub-desc {\r\n  margin-top: -6px;\r\n}\r\n\r\n.lock-grid {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  gap: 8px;\r\n}\r\n\r\n.lock-btn {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding: 10px 12px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 10px;\r\n  cursor: pointer;\r\n  transition: all 0.2s;\r\n  font-family: inherit;\r\n}\r\n\r\n.lock-btn:hover {\r\n  border-color: var(--line-2);\r\n}\r\n\r\n.lock-btn.locked {\r\n  border-color: var(--red);\r\n  background: color-mix(in srgb, var(--red) 8%, transparent);\r\n}\r\n\r\n.lock-dot {\r\n  width: 8px;\r\n  height: 8px;\r\n  border-radius: 50%;\r\n  background: var(--green);\r\n  flex-shrink: 0;\r\n  transition: all 0.2s;\r\n}\r\n\r\n.lock-btn.locked .lock-dot {\r\n  background: var(--red);\r\n  box-shadow: 0 0 6px var(--red);\r\n}\r\n\r\n.lock-name {\r\n  font-size: 13px;\r\n  font-weight: 700;\r\n  flex: 1;\r\n  text-align: left;\r\n  color: var(--text);\r\n}\r\n\r\n.lock-state {\r\n  font-size: 11px;\r\n  color: var(--muted);\r\n  font-family: var(--font-mono);\r\n}\r\n\r\n.lock-btn.locked .lock-state {\r\n  color: var(--red);\r\n}\r\n\r\n/* ===== 力量限制器 ===== */\r\n.limiter-row {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 12px;\r\n  padding: 12px 14px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n  transition: border-color 0.2s, background 0.2s;\r\n}\r\n\r\n.limiter-row.released {\r\n  border-color: var(--amber);\r\n  background: color-mix(in srgb, var(--amber) 6%, var(--panel-2));\r\n}\r\n\r\n.limiter-info {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 2px;\r\n}\r\n\r\n.limiter-label {\r\n  font-size: 13px;\r\n  font-weight: 700;\r\n  color: var(--text);\r\n}\r\n\r\n.limiter-row.released .limiter-label {\r\n  color: var(--amber);\r\n}\r\n\r\n.limiter-desc {\r\n  font-size: 11px;\r\n  color: var(--muted);\r\n  line-height: 1.5;\r\n}\r\n\r\n.switch {\r\n  position: relative;\r\n  flex-shrink: 0;