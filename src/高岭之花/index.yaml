--line);\r\n  border-radius: 12px;\r\n  overflow: hidden;\r\n}\r\n\r\n.core-label {\r\n  font-size: 10px;\r\n  color: var(--muted);\r\n  letter-spacing: 1px;\r\n}\r\n\r\n.core-value {\r\n  font-size: 15px;\r\n  font-weight: 800;\r\n  letter-spacing: 1px;\r\n}\r\n\r\n.core-dot {\r\n  position: absolute;\r\n  top: 10px;\r\n  right: 10px;\r\n  width: 7px;\r\n  height: 7px;\r\n  border-radius: 50%;\r\n  background: var(--green);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 18%, transparent);\r\n}\r\n\r\n.core-cell.is-running .core-value {\r\n  color: var(--green);\r\n}\r\n\r\n.core-cell.is-running .core-dot {\r\n  background: var(--green);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 18%, transparent);\r\n}\r\n\r\n.core-cell.is-stopped .core-value {\r\n  color: var(--red);\r\n}\r\n\r\n.core-cell.is-stopped .core-dot {\r\n  background: var(--red);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent);\r\n}\r\n\r\n.core-cell.is-frozen .core-value {\r\n  color: var(--blue);\r\n}\r\n\r\n.core-cell.is-frozen .core-dot {\r\n  background: var(--blue);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent);\r\n}\r\n\r\n/* ===== 关键指标 ===== */\r\n.metric-grid {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  gap: 9px;\r\n}\r\n\r\n.metric {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 5px;\r\n  padding: 11px 12px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n}\r\n\r\n.metric-label {\r\n  font-size: 10px;\r\n  color: var(--muted);\r\n  letter-spacing: 1px;\r\n}\r\n\r\n.metric-num {\r\n  font-family: var(--font-mono);\r\n  font-size: 22px;\r\n  font-weight: 700;\r\n  line-height: 1;\r\n  color: var(--text);\r\n\r\n  i {\r\n    font-style: normal;\r\n    font-size: 11px;\r\n    color: var(--muted);\r\n    margin-left: 2px;\r\n  }\r\n}\r\n\r\n.metric-bar {\r\n  height: 5px;\r\n  border-radius: 3px;\r\n  background: var(--line);\r\n  overflow: hidden;\r\n\r\n  i {\r\n    display: block;\r\n    height: 100%;\r\n    border-radius: 3px;\r\n    background: var(--accent);\r\n    transition: width 0.4s ease;\r\n  }\r\n}\r\n\r\n.metric-bar.amber i {\r\n  background: var(--amber);\r\n}\r\n\r\n.metric-bar.blue i {\r\n  background: var(--blue);\r\n}\r\n\r\n.metric-bar.purple i {\r\n  background: var(--purple);\r\n}\r\n\r\n.metric-bar.red i {\r\n  background: var(--red);\r\n}\r\n\r\n.metric-stage {\r\n  font-size: 10.5px;\r\n  color: var(--amber);\r\n  font-weight: 700;\r\n  margin-top: -1px;\r\n}\r\n\r\n/* ===== 环境 ===== */\r\n.env-row {\r\n  display: flex;\r\n  gap: 8px;\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.env-item {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  padding: 7px 11px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 999px;\r\n  font-size: 11.5px;\r\n  color: var(--text);\r\n}\r\n\r\n.env-ico {\r\n  color: var(--accent);\r\n  font-size: 12px;\r\n  line-height: 1;\r\n}\r\n\r\n/* ===== 认知摘要 ===== */\r\n.cog-summary {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 5px;\r\n  padding: 9px 11px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-left: 3px solid var(--accent);\r\n  border-radius: 8px 10px 10px 8px;\r\n}\r\n\r\n.cog-summary-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n}\r\n\r\n.cog-self {\r\n  font-size: 9.5px;\r\n  color: var(--accent);\r\n  font-weight: 700;\r\n  letter-spacing: 0.5px;\r\n}\r\n\r\n.cog-self.off {\r\n  color: var(--muted);\r\n}\r\n\r\n.cog-dim-row {\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 8px;\r\n}\r\n\r\n.cog-dim-key {\r\n  font-size: 10px;\r\n  color: var(--muted);\r\n  font-weight: 700;\r\n  flex-shrink: 0;\r\n  min-width: 28px;\r\n}\r\n\r\n.cog-tag {\r\n  font-size: 10px;\r\n  color: var(--accent);\r\n  font-weight: 700;\r\n  letter-spacing: 1px;\r\n  flex-shrink: 0;\r\n}\r\n\r\n.cog-text {\r\n  font-size: 11.5px;\r\n  color: var(--text);\r\n  line-height: 1.55;\r\n}\r\n\r\n/* ===== 运行概况 ===== */\r\n.overview-row {\r\n  display: grid;\r\n  grid-template-columns: repeat(4, 1fr);\r\n  gap: 8px;\r\n}\r\n\r\n.ov-item {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  gap: 2px;\r\n  padding: 9px 4px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n}\r\n\r\n.ov-num {\r\n  font-family: var(--font-mono);\r\n  font-size: 16px;\r\n  font-weight: 700;\r\n  color: var(--accent);\r\n  line-height: 1;\r\n}\r\n\r\n.ov-label {\r\n  font-size: 9.5px;\r\n  color: var(--muted);\r\n  letter-spacing: 1px;\r\n}\r\n\r\n/* ===== 机体总览 + 液体储备 ===== */\r\n.body-cols {\r\n  display: flex;\r\n  gap: 10px;\r\n  width: 100%;\r\n}\r\n\r\n.body-col {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 6px;\r\n  min-width: 0;\r\n  box-sizing: border-box;\r\n\r\n  &:first-child {\r\n    width: 70%;\r\n  }\r\n\r\n  &:last-child {\r\n    width: 30%;\r\n  }\r\n}\r\n\r\n.body-thumb-head {\r\n  width: 100%;\r\n  box-sizing: border-box;\r\n}\r\n\r\n.body-fluid-head {\r\n  width: 100%;\r\n}\r\n\r\n.body-fluid-wrap {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  height: 474px;\r\n  width: 100%;\r\n  box-sizing: border-box;\r\n  padding: 10px 8px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n}\r\n\r\n.fluid-gauges-c {\r\n  display: flex;\r\n  justify-content: center;\r\n  align-items: center;\r\n  gap: 24px;\r\n  padding: 6px 0;\r\n}\r\n\r\n.fluid-gauge {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  gap: 4px;\r\n}\r\n\r\n.fg-track {\r\n  position: relative;\r\n  display: block;\r\n  width: 26px;\r\n  height: 400px;\r\n  border-radius: 13px;\r\n  background: var(--panel);\r\n  border: 1px solid var(--line);\r\n  overflow: hidden;\r\n\r\n  i {\r\n    position: absolute;\r\n    left: 0;\r\n    bottom: 0;\r\n    width: 100%;\r\n    border-radius: 10px 10px 11px 11px;\r\n    background: linear-gradient(180deg, var(--blue), color-mix(in srgb, var(--blue) 70%, #fff));\r\n  }\r\n}\r\n\r\n.fluid-gauge.pink .fg-track i {\r\n  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #fff));\r\n}\r\n\r\n.fg-val {\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  font-family: var(--font-mono);\r\n  color: var(--text);\r\n}\r\n\r\n.fg-label {\r\n  font-size: 11px;\r\n  color: var(--muted);\r\n}\r\n\r\n/* ===== 电源控制 ===== */\r\n.power-seg {\r\n  position: relative;\r\n  display: grid;\r\n  grid-template-columns: repeat(3, 1fr);\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n  padding: 4px;\r\n  overflow: hidden;\r\n}\r\n\r\n.power-opt {\r\n  position: relative;\r\n  z-index: 1;\r\n  padding: 9px 0;\r\n  border: none;\r\n  background: transparent;\r\n  font-size: 12px;\r\n  font-weight: 700;\r\n  color: var(--muted);\r\n  cursor: pointer;\r\n  font-family: inherit;\r\n  transition: color 0.25s;\r\n}\r\n\r\n.power-opt:hover:not(:disabled) {\r\n  color: var(--text);\r\n}\r\n\r\n.power-opt:disabled {\r\n  cursor: not-allowed;\r\n}\r\n\r\n.power-opt.active {\r\n  color: #fff;\r\n}\r\n\r\n.power-thumb {\r\n  position: absolute;\r\n  top: 4px;\r\n  bottom: 4px;\r\n  left: 4px;\r\n  width: calc((100% - 8px) / 3);\r\n  border-radius: 9px;\r\n  background: var(--accent);\r\n  box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 50%, transparent);\r\n  transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), background 0.32s ease;\r\n}\r\n\r\n.power-thumb.thumb-0 {\r\n  transform: translateX(0);\r\n  background: var(--green);\r\n}\r\n\r\n.power-thumb.thumb-1 {\r\n  transform: translateX(100%);\r\n  background: var(--amber);\r\n}\r\n\r\n.power-thumb.thumb-2 {\r\n  transform: translateX(200%);\r\n  background: var(--red);\r\n}\r\n\r\n.power-actions {\r\n  display: flex;\r\n  align-items: center;\r\n  g