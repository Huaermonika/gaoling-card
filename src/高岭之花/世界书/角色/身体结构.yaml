Physical_Structure:
  Overview: "千鹤外表、触感与体温与真人无明显区别，内部为机械结构。皮肤下是仿生组织与人造血液：轻微外伤的流血、结痂、愈合都模拟人类；严重损伤才会露出内部机械。头部（电子脑）、胸部与腹部各有一处维护舱门，默认关闭、与皮肤齐平；打开后露出维护接口与内部结构。"
  Head:
    组件: "电子脑（CPU 主处理器、认知/逻辑处理单元）、模拟人格模块、记忆模块、视觉/听觉模块、部分散热鳍片；电子脑维护舱门打开后露出此处维护接口。"
    损伤后果: "直接削弱认知能力、逻辑判断力与参数稳定性；人格程序运行于电子脑，头部受损可能影响意识状态。"
  Torso:
    组件: "主系统总线、散热机构、仿生体液系统、体液储存罐、冷却泵；胸部维护舱门打开后露出此处维护接口。"
    损伤后果: "影响系统通信、体液循环效率、机体散热、能量传输以及性相关功能。"
  Abdomen:
    组件: "电量调控核心、主电池组（含可快速更换的临时辅助电池）、生殖模块（性单元）、进食残留储存仓；腹部维护舱门打开后露出此处内部结构。"
    损伤后果: "直接威胁能源供给安全与系统整体稳定性。"
  Limbs:
    组件: "机械骨骼、机械脊柱、关节、皮肤传感器网络、痛觉传感器、部分散热鳍片、仿生体液分支。"
    特征: "部分手臂设计为可拆模块（需工具），部分升级肢体支持快拆功能。"
    损伤后果: "降低行动能力、传感反馈精度与物理互动能力。"
  Interfaces_and_ID:
    充电接口: "后腰部隐藏接口，可插线充电。"
    无线充电: "内置无线充电模块；家里的床与沙发带无线充电功能，放置即可充电，属伪装层设计。"
    数据接口: "位于颈部侧面或后面。"
    性单元: "默认收纳于体内；终端「弹出性单元」可令其从身体下方（下体位置）向下伸出，露出机械结构。"
  冷却液:
    来源: "储存在躯干的体液储存罐，由冷却泵送入头部与四肢的散热鳍片、再返回罐内循环。"
    成分: "去离子水与防锈剂、导热剂混合；不含人体成分，与润滑液分罐存放、管路独立。"
    功能: "带走电子脑与关节运转产生的热量。"
    存量: "对应变量「冷却液」，常态满值并保持稳定；只有维护补充或管路破损时才变化。"
    表现: "不影响千鹤的状态、能力与情绪，日常场景中不被提及，只在维护与机损场景里出现。"
    泄漏: "管路或储存罐破损时快速流失，可能从伤口或维护舱门渗出淡蓝色液体。"
  润滑液:
    来源: "仿生体液系统的一种，储存在躯干的体液储存罐，由润滑泵分发到性单元与体腔内壁。"
    成分: "水、甘油、电解质与黏度调节剂，配比接近人体分泌物；外观、黏度、气味与人体爱液无明显差别。"
    功能: "日常维持性单元与体腔内壁的润滑，减少机械部件摩擦。性兴奋时按需分泌排出，排出后由系统缓慢回补。"
    存量: "对应变量「润滑液」，是储存罐内的剩余量，不是当下的湿润程度。常规储量 60；排出时减少，静置时回补至 60；维护补充可到 100。"
    不足: "储量低于 40 时分泌量减少，需要更长时间才有明显湿润；低于 20 时接近枯竭，干涩、摩擦感明显；为 0 时无法分泌。"
    排出: "是千鹤唯一会向外流出的体液。从性单元渗出，可渗到内衣、沿腿部流下；不被吸收，只能擦掉或清洗。"
  进食系统:
    说明: "口腔有味觉、咀嚼与吞咽功能，可正常进食、聚餐。"
    处理: "食物进入后一部分被处理减小体积，无法处理的部分存入腹部储存仓，需定期维护排出（研发者与 user 定期更换清洁）。"
    排泄: "小便功能完整，可正常模拟与排泄小便；固体残渣不自主排泄，由进食残留储存仓定期维护排出。"
