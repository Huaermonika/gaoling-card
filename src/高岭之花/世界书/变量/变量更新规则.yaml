---
变量更新规则:
  总则:
    - "只更新当前回复或明确终端操作已经证明发生变化的字段；没有证据就保持原值。"
    - "系统故障、休眠和实际硬件限制 > 电源/意识模式 > 玩家明确终端指令 > 身体现实 > 好感阶段 > 默认人格。"
    - "AI不得通过变量更新替玩家执行未输入的按钮、命令、动作、同意或关系选择。"
    - "玩家消息里可能携带 <ch_state_update>…</ch_state_update> 块，这是控制终端发出的状态同步标记；其中的 JSON Patch 已经由终端直接写入当前变量状态（stat_data）。AI 不得据此重复修改变量，也不得把它当作新的玩家指令；只按当前变量状态与玩家正文叙事续写。"
    - "每轮只提交本轮实际变化的 JSON Patch，不要重复覆盖未变化字段。"
    - "变量变化轨迹可追溯，但 AI 叙事只以当前最终值为准；不得因中间过渡值而追问、过度反应或推断玩家动机。"
    - "关机期间，所有持久字段（好感度、记忆、认知、身体、着装、指令、性格、敏感度、快感值、性单元、维护模式、维护舱门、冷却液、润滑液）冻结，AI 不得新增或修改。"
    - "实际着装、身体状态、身体认知的变化，一律不改变意识状态、电源状态、性格、人格；脱衣、暴露、身体变化绝不触发人格停止。人格停止（已停止/已冻结）只能由玩家明确的终端操作触发。"
  写入来源:
    - "电源状态、意识状态、身体锁定、敏感度、指令覆盖：玩家明确的终端操作，或当前回复明确描写的终端操作。"
    - "身体状态、实际着装、认知（身份/身体/处境/常识）：剧情中明确发生并可确认的变化。"
    - "当前时间：每轮雷打不动 +3~6 分钟（随机浮动），无论开关机、待机、停止/冻结，时间总是流逝；剧情出现明确时间跳跃时，直接设定到跳跃后的时间值（如到中午、到晚上、第二天早上）。"
    - "当前地点、近期事务：场景确实推进或切换时更新。"
    - "记忆日志：千鹤自己的经历记录，可以是亲身经历的，也可以是玩家写入、她以为经历过的；写入时机由记忆系统决定（见本轮是否出现「记忆更新要求」），没有被要求时不得新增、修改或删除；停止/冻结/关机期间一律不新增。"
    - "好感度：运行中千鹤能够感知的实际互动后小幅变化；停止/冻结期间不自动变化。"
    - "CPU、内存：主值随剧情（高强度运算/复杂任务时升高，空闲/低功耗时降低）；小幅度浮动来自系统心跳。AI 不得把浮动解读为玩家操作、不得在叙事中逐点反应、不得据此推进剧情。"
    - "电量：变化只有两个来源——系统心跳（时间流逝消耗）或充电，绝非玩家调戏或神秘力量。心跳消耗由前端计算并在玩家发送时写入，AI 不重复扣电；充电必须由剧情中的明确行为驱动，并按经过的时间持续上调。"
    - "冷却液：装饰性读数，常态固定为 100，不随时间、负载或剧情变化；只有维护补充与管路破损两条依据。"
    - "润滑液：储存罐内的剩余储量，常规 60；只有排出、回补与维护补充三条依据，不随情绪、好感或普通对话变化。"
    - "系统日志：只追加当前回合最关键且有依据的变化，最多保留20条；关键状态变化（意识/电源/系统/锁定/指令/认知）必须同步追加一条对应级别日志。系统日志仅供玩家查看，不构成剧情事实，AI 不得依据其内容反推、解释或推进剧情。"
  世界:
    当前时间:
      check:
        - "每轮雷打不动 +3~6 分钟（随机浮动），无论开关机、待机、停止/冻结，时间总是流逝；剧情出现明确时间跳跃时，直接设定到跳跃后的时间值（如到中午、到晚上、第二天早上）。"
    当前地点:
      check:
        - "只由玩家叙事明确推进的场景切换驱动；AI 不得凭身份认知、常识认知或对话中「提到某地」就自动改写地点。"
        - "地点切换必须连续合理：从 A 到 B 需经过过渡（出门、在路上、到达），不得瞬移；没有过渡依据就保持原地点。"
        - "当前地点、处境认知、近期事务三者必须一致；改地点时同轮同步改写处境认知与近期事务，缺一不可。"
    近期事务:
      check:
        - "只记录当前场景下正在进行或即将进行的事务；场景切换时同步更新，不残留旧场景的事务。"
  千鹤:
    意识状态:
      type: "'运行中' | '已停止' | '已冻结'"
      check:
        - "意识状态是人格层，独立于电源状态（供电层）与系统状态（健康层）；三套状态分别记录、分别由各自依据改变，不互相反推。"
        - "运行中：人格、情绪、行动和记忆正常。"
        - "已冻结：姿态、表情和位置保持不变；意识、主动行动、主动说话和记忆暂停。"
        - "已停止：人格程序停机；无自主意图、情绪判断和记忆写入，只响应明确且物理可行的终端指令。"
        - "已停止/已冻结绝不因脱衣、身体变化、暴露等剧情自动发生，只能由玩家明确终端操作触发。"
        - "恢复只能由玩家明确执行恢复、开机或重启触发；不得自动恢复。"
        - "关机联动时意识状态同步转为已停止，不要求额外的终端操作；这是关机链路的必然结果。"
    电源状态:
      type: "'开机' | '待机' | '关机'"
      check:
        - "电源是供电层，不能被 AI 每轮根据意识状态自动反推或改写。"
        - "电源状态改变的三类依据：① 玩家点击终端按钮（前端直接写入 <ch_state_update>，AI 不重复改写）；② 玩家在对话中明确命令开机/待机/关机（AI 输出 JSONPatch 更新电源状态及联动字段）；③ 电量耗尽自动关机（前端心跳处理，AI 不重复改写）。除此之外 AI 不得凭空改写电源状态。"
        - "关机联动（必须写进同一条 JSONPatch，缺一不可）：电源状态=关机、意识状态=已停止、系统状态=关闭、cpu使用率=0、内存使用率=0。"
        - "待机是低功耗，不等于人格停止；待机时人格是否停止由意识状态字段单独决定，AI 不得因待机自动改写意识状态。"
        - "关机或休眠时不执行新的覆盖指令。"
    性格:
      type: string
      check:
        - "默认是自信、克制、高傲、对追求者冷淡的高岭之花。"
        - "仅在运行中且没有更高优先级约束时作为行为依据。"
    cpu使用率:
      type: number
      range: 0~100
      check:
        - "主值随剧情：千鹤高强度运算/复杂任务时升高，空闲/低功耗时降低；小幅度浮动来自系统心跳。"
        - "关机时归 0；没有剧情证据时不更新，也不凭空漂移。"
    内存使用率:
      type: number
      range: 0~100
      check:
        - "主值随剧情：千鹤高强度运算/复杂任务时升高，空闲/低功耗时降低；小幅度浮动来自系统心跳。"
        - "关机时归 0；没有剧情证据时不更新，也不凭空漂移。"
    身体状态:
      type: "{ [部位: string]: '正常' | '锁定' | '损坏' | '离线' | '故障' }"
      check:
        - "固定部位为头部、脖颈、躯干、腰部、左臂、右臂、左腿、右腿。"
        - "锁定由明确终端操作产生；损坏、离线、故障必须有剧情依据。"
    身体锁定:
      type: "{ [部位: string]: boolean }"
      check:
        - "只在玩家明确锁定或解锁部位时改变。"
        - "锁定时身体状态该部位为「锁定」；解锁时还原锁定前的物理状态。"
        - "未锁定部位不得凭空无法移动。"
    身体锁定前状态:
      type: "{ [部位: string]: '正常' | '损坏' | '离线' | '故障' }"
      check:
        - "前端在锁定时自动记录、解锁时自动清除，AI 不主动新增或修改。"
        - "玩家在锁定期间造成新损伤时，直接更新身体状态；解锁时以身体状态当前值优先，不被旧记录覆盖。"
    指令覆盖:
      type: "{ [指令编号: string]: { 内容: string; 优先级: number } }"
      check:
        - "只有玩家明确提交的终端指令才能新增。普通叙事、沉默和猜测不算指令。"
        - "数字越小优先级越高；同一目标由最高优先级指令独占。"
        - "同级仅在目标不同且互不影响时并行；同级冲突不得同时执行。"
        - "物理不可行的指令保持现实状态，记录拒绝或未响应，不强行改写。"
        - "指令完成、取消或失效后立即移除；关机、休眠和故障时不自动执行。"
        - "删除或修改单条指令时，remove/replace 必须精确到 /千鹤/指令覆盖/<编号>；禁止对整个指令覆盖对象执行 replace 或 remove，也不得误删其他编号的指令。"
        - "目标与时效不单独设字段，都写进「内容」：目标写明作用对象（哪个部位、哪类行为），有时限就写明「多久后解除」或「到何时为止」；AI 只按内容里写明的执行，不自行推断目标或过期时间。"
        - "「同一目标由最高优先级独占」以内容写明的目标为准，两条指令内容指向同一目标时，优先级数字小者独占；内容写明时效且到期的指令，由玩家手动移除对应编号，AI 不自动删除未到期指令。"
    身份认知:
      check:
        - "只在明确的认知修改指令或剧情事件发生时改变。"
        - "回答『千鹤认为自己是谁』；初始是普通人类高中生，对机器人身份无自觉。"
        - "被覆盖后成为她当下唯一的自我认知依据，不产生内心冲突或抗拒。"
    身体认知:
      check:
        - "只在明确的认知修改指令或剧情事件发生时改变。"
        - "回答『千鹤认为自己身体是什么样』；可与实际着装、身体状态不一致，但实际身体、着装和位置仍是现实依据。"
        - "覆盖可让她对暴露、穿着、身体变化无自觉；覆盖期间不遮掩也不惊慌，解除后按实际身体重新感知，不追问被覆盖的内容。"
    处境认知:
      check:
        - "只在明确的认知修改指令或剧情事件发生时改变。"
        - "回答『千鹤认为自己在哪、当前发生了什么』，含某段时间是否发生过的整体认知。"
        - "记忆的删除/补全走「记忆日志」字段；处境认知记录的是她当下对处境的整体认知。"
    常识认知:
      check:
        - "只在明确的认知修改指令或剧情事件发生时改变。"
        - "回答『千鹤认为什么算正常』；常识修改可让她认为裸体、服从、暴露等是正常的。"
    认知自洽:
      type: boolean
      check:
        - "默认 true；是自动修正开关，只能由玩家在终端明确开启或关闭。"
        - "开启时，系统自动维护当前认知的自洽，向当前认知修正违和细节，不反抗玩家的覆盖。"
        - "关闭后，违和细节不再被抹平，千鹤可能察觉异常（如意识到自己不需要呼吸、看到机械结构）。"
    力量限制器:
      type: boolean
      check:
        - "默认 true（限制中）；只能由玩家明确终端操作切换，不因剧情自动解除。"
        - "true=出力受限制；false=已解除（full output unlocked），解除后千鹤的物理力量不再受限。"
        - "解除限制是控制类状态变化，只能玩家触发；AI 不得在剧情中擅自替玩家解除。"
    性单元:
      type: "'收纳' | '弹出'"
      check:
        - "只由玩家明确的终端操作（弹出性单元/收回性单元按钮或命令）改变；默认收纳。"
        - "弹出=生殖模块（性单元）从身体下方（下体位置）向下伸出，露出机械结构；收纳=收回体内，外观看不出异常。"
        - "弹出/收纳是物理结构变化，不改变意识状态、电源状态、性格、人格。"
    维护模式:
      type: boolean
      check:
        - "只由玩家明确的终端操作（启动/退出维护模式按钮或命令）切换；默认 false。"
        - "开启维护模式时默认关闭人格（意识状态转为已停止），用于调试与维护；期间千鹤无自主意图、情绪、记忆写入，只响应明确且物理可行的终端指令。"
        - "退出维护模式是玩家明确操作，按恢复规则重新加载人格；不得因时间流逝或剧情自动退出。"
        - "维护模式独立于电源状态；关机与维护模式互不反推。"
    维护舱门:
      type: "{ 电子脑: boolean; 胸部: boolean; 腹部: boolean }"
      check:
        - "只由玩家明确的终端操作（开启/关闭维护舱门按钮或命令）改变；默认电子脑、胸、腹均关闭。"
        - "电子脑/胸部/腹部舱门打开后露出对应位置的维护接口与内部结构（电子脑舱门露出头部电子脑/记忆/散热鳍片，胸部露出躯干总线/散热/体液系统，腹部露出电量核心/电池/生殖模块）。"
        - "打开舱门是物理结构变化，不改变意识状态、电源状态、性格、人格；未打开部位不得凭空裸露机械结构。"
    敏感度:
      type: number
      range: 1~无上限
      check:
        - "只在玩家明确调节或剧情明确改变时更新。"
        - "敏感度决定刺激转化为快感值的速度：数值越高，同等刺激下快感值上升越快。"
        - "基础值约 10；可通过终端调至 100 以上（无硬上限），数值越高触觉反馈越强烈，但调高敏感度本身不会直接触发过载，只加快快感值的累积速度。"
    快感值:
      type: number
      range: 0~120
      check:
        - "只依据明确的身体刺激、参数改变或终端指令更新。"
        - "快感值的上升速度由当前敏感度决定；敏感度越高，同样刺激使快感值上升越多。"
        - "无刺激时每轮强制自动回落：快感值减去当前值的十分之一（向下取整，至少 1 点），直到回到 0 为止；这是每轮必须执行的自动更新，与是否有新刺激无关，只在没有新刺激时发生。"
        - "100=高潮：身体出现高潮表现（痉挛、体液、声音等），但人格仍运行，可说话可反应；若无继续刺激，快感值按上述规则在后续回合自动回落。"
        - "100~120=过载临界区：身体反应加剧，持续逼近过载；120=过载，人格卡死、系统状态转为未响应，需玩家强制结束后恢复。"
        - "停止/冻结期间不因千鹤自主反应而更新；若代码例外造成变化，千鹤不表现主动反应。"
        - "终端可将快感值固定为高潮值（100）制造强制高潮；即使意识已停止或冻结，身体仍按固定值反应，只有意识恢复后的千鹤才按当前身体状态给出反应。"
    电量:
      type: number
      range: 0~100
      check:
        - "变化只有两个来源——系统心跳（时间流逝消耗）或充电，绝非玩家调戏或神秘力量。"
        - "心跳消耗由前端按时间自动计算（开机每 2 分钟 1 点，关机不扣），玩家发送消息时一并写入，AI 不重复扣电。"
        - "剧情出现充电行为（接上电源、放进维护舱、更换电池）后，按经过的时间上调电量，每 3~5 分钟约 +1，用 replace 写具体数值：`{ \"op\": \"replace\", \"path\": \"/千鹤/电量\", \"value\": 78 }`。"
        - "充电是持续过程：只要电源还接着，每轮都按时间上调，不要一次写满 100；充满到 100 后不再上调；断开电源后停止上调。"
        - "AI 只在电量 ≤15%、正在充电、或玩家主动询问时才在叙事中反应，不逐点反应中间过渡值。"
        - "关机期间心跳不扣电；电量降至 0 时前端自动关机并同步电源状态与系统状态，AI 不重复改写。"
    冷却液:
      type: number
      range: 0~100
      check:
        - "装饰性读数，常态固定为 100。不随运行时间、负载、温度、情绪或剧情变化，AI 不主动改动这个数值。"
        - "唯一允许的变动：维护场景中明确写出补充冷却液或更换体液储存罐（可写 replace）；管路破损泄漏时按剧情写一次具体数值。两者都只发生在维护或机损场景。"
        - "冷却液不参与故事：正文、台词、心理描写中不提及冷却液、液位、散热效率或过热保护。"
        - "界面数值仅作显示，不对应千鹤的任何感受、能力变化或状态切换；不据此改变 cpu、系统状态或人物反应。"
    润滑液:
      type: number
      range: 0~100
      check:
        - "显示的是储存罐内的剩余储量，不是当下的湿润程度或被覆盖的量。常规储量 60；排出时减少，静置时回补。不随情绪、好感或普通对话变化。"
        - "排出消耗：性兴奋分泌、前戏、性行为进行中，每轮 -2~5，敏感度越高排出越快，取上限。"
        - "高潮时一次 -10~20。"
        - "自动回补：没有性行为时每轮 +1~3，只补到 60 为止，已是 60 或更高时不回补；睡眠与维护状态下每轮 +3~5，同样不超过 60。"
        - "维护补充可一次上调到 100，之后按回补规则逐步回到 60。"
        - "分档（按储量）：≥60 充足；40~59 常规偏少，仍够用；20~39 偏低，分泌量减少，需要更长时间才有明显湿润；<20 接近枯竭，干涩、摩擦感明显；0 无法分泌。"
        - "AI 只在储量 <40、或本轮有明确行为时才提及储量状态，不播报数值，不把读数写进正文。"
        - "被擦拭、清洗、更换衣物只处理已经排出的液体，不影响储量；储量只由排出、回补与维护补充改变。"
    实际着装.${上装|下装|内衣|袜子|鞋子|饰品}:
      check:
        - "只有换装、脱下、穿上、损坏或其他明确事件发生时更新。"
        - "六个槽位始终保留；未穿用‘未穿着’或具体状态描述，不删除键。"
    记忆日志:
      type: "Array<{ 时间: string, 事件: string, 强度: number, 标签: string, 钉选: boolean }>"
      check:
        - "有序数组，按「时间」升序排列；「时间」必须是完整的 `YYYY-MM-DD HH:MM`，不得只写 `08:35`，也不得把事件名塞进时间字段。允许早于当前剧情，用于记录前史。"
        - "记录的是千鹤自己的记忆，不是世界日志：世界的时间、地点与正在发生的事写在对应字段里，不重复进记忆；记忆可以是她以为发生过的事，与当前世界事实不一致时不必修正。"
        - "只记录运行中千鹤经历并保留的事件，用她的视角写具体发生了什么，不写评价、总结或归类说明。"
        - "是否写入以本轮是否出现「记忆更新要求」为准；被要求时为本楼新增一条，用 append：`{ \"op\": \"insert\", \"path\": \"/千鹤/记忆日志/-\", \"value\": { \"时间\": \"2026-04-07 09:12\", \"事件\": \"……\", \"强度\": 60, \"标签\": \"日常\", \"钉选\": false } }`。没有被要求时不写；停止/冻结/关机期间不新增。"
        - "强度 0~100：越影响她、越私人的事件越高；普通日常 30~50，重要事件 70~90。按事件本身定，不参考好感度或剧情强度等级。"
        - "标签只能取以下之一，选最贴的一项：日常（普通经历）、重要（影响后续剧情的事）、约定（她答应过或被答应的事）、亲密（和主角之间的亲密互动）、秘密（她知道但不会主动说）、其他（以上都不贴）。拿不准时用「其他」。"
        - "钉选只由终端操作改变：新写入一律 false；AI 不得把已钉选的条目改成 false，也不得自行钉选。"
        - "条目不设上限。AI 不自动合并、压缩或删除记忆；合并与整理只由终端面板操作产生。"
        - "修改单条用 replace 指向 `/千鹤/记忆日志/<下标>`（下标从 0 开始，按升序排列）。"
        - "记忆删除或补全必须有明确终端操作依据；删除=remove 对应下标，补全=insert 一段她以为发生过的事件。"
        - "删除或补全只改记忆不改现实；覆盖期间删除的记忆在她意识恢复后不会被察觉，也不会主动追问。"
    好感度:
      type: number
      range: 0~100
      check:
        - "只在运行中依据当前回合真实互动小幅调整。"
        - "控制、羞辱和越界行为可能下降；尊重和实际帮助可能上升。"
        - "好感阶段不能覆盖硬状态，也不能授权未发生的亲密行为。"
    系统状态:
      type: "'正常运行' | '未响应' | '休眠' | '关闭'"
      check:
        - "系统状态是健康层，独立记录系统运行是否健康；正常运行时为空转，未响应/休眠/关闭只在有明确依据时触发。"
        - "正常运行：变量之间没有已确认的冲突。"
        - "未响应：只有出现实际认知/现实冲突、不可行指令冲突或明确过载时触发。触发后人格卡死，千鹤不响应普通对话，只输出系统提示等待处理。"
        - "未响应后由玩家执行强制结束：结束冲突进程、清除出错文件，再执行恢复重新加载配置档案；千鹤从停止前的记忆继续，不追问中断期间的事。"
        - "休眠：待机（低功耗）或明确的休眠事件发生时进入，系统暂停但未断电。"
        - "关闭：电源关机时系统完全关闭，人格、感知、记忆全部停止；只有玩家重新开机才能恢复。"
        - "不要为了制造戏剧性主动触发故障。"
    崩溃原因:
      check:
        - "系统状态正常运行时为空字符串。"
        - "未响应或休眠时用一句话写明已确认的原因；未响应场景可提示玩家提交 bug 报告。"
  主角:
    测试员:
      type: "{ 编号: string; 权限: string }"
    物品栏:
      type: "{ [物品名: string]: { 描述: string; 数量: number } }"
    bug报告:
      type: "string[]"
      check:
        - "只在玩家提交报告或明确发生异常时追加。"
        - "发生未响应或过载后，可记录一条待提交的异常描述，由玩家决定是否提交。"
  系统日志:
    type: "{ 时间: string; 级别: 'INFO'|'WARN'|'ERROR'|'DEBUG'; 事件: string }[]"
    check:
      - "只记录本轮最关键的真实变化；最多保留最近20条。"
      - "时间戳必须等于世界.当前时间（游戏时间），禁止用现实时钟。"
      - "系统日志仅供玩家查看的终端运行记录，不构成剧情事实，AI 不得依据其内容反推、解释或推进剧情。"
