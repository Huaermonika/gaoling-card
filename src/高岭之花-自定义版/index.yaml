      启用: true
      查找表达式: /<ch_writing>[\s\S]*?<\/ch_writing>/gi
      内容: ''
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[隐藏]额外提示词'
