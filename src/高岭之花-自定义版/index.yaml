作品。\n「校园、机娘、遥控器、催眠」这个题材，在我脑子里躺了很久，\n是老师的作品推了我最后一把，让我把它做出来。\n谢谢老师。\n我是逛 P 站的时候，看到老师的画还有老师的游戏demo。\n他的主页也在 P 站，搜名字就能找到。\n下一扇门，藏在名字里：\n把「セロハンてぇぷ」这七个假名，一笔一笔地数。\n半浊点也算一笔。笔画数连成一长串，就是密码。',bts:'卷三 · 花絮\n\n我做这张角色卡的时候 DeepSeek 涨价了。\n发布那一刻，我看了一眼花销，和当时输入、输出所有的价格。\n整整 103.56 元，够我买 8.63 杯奶茶了。\n抹掉小数点——这个数，就是下一扇门。',thanks:'卷四 · 致谢\n\n谢谢你，一路找到这里。\n这张卡从草图，到你能拿在手里玩的完整角色，中间隔着很多个深夜……我的写卡助手不能自己授权自己只能我一个一个盯着点（幽怨）。\n调前端、调人格、看着自己的token疯狂燃烧……\n做出来的东西有人喜欢，是比什么都开心的事。\n现在，收尾。\n前面三卷，每一卷都藏了一串数字——你一路都没用上它们。\n发布页、主页、或是别的什么伤心的地方，也都各藏着一串。\n把它们找出来，原样拼在一起，不要做任何计算。\n那就是最终的KEY。\n联系作者，领取你来自「智斗密码」奖励'};function m(e){const n=e.split('\n');return[{kind:'sys',text:`── ${n[0]} ──`},...n.slice(1).map(e=>({kind:'prose',text:e}))]}const b={help:{usage:'help [cmd]',desc:'list all commands or show one command',run:e=>{const n='zh'===Jg.termLang;if(e[0]){const n=b[e[0].toLowerCase()];return n?[{kind:'out',text:`${e[0].toLowerCase()} — ${y(e[0].toLowerCase())}`},{kind:'out',text:`usage: ${n.usage}`}]:[{kind:'err',text:`no such command: ${e[0]}`}]}const t=[];return[['SYSTEM','系统',['help','status','info','power','reboot','uptime','date','clear','echo']],['COGNITION','认知',['persona','cognition','memory']],['PHYSIQUE','躯体',['sense','pleasure','body','wear','limiter']],['DIAGNOSTIC','诊断',['log','whoami','ping','unlock','about']]].forEach(([e,r,a])=>{t.push({kind:'sys',text:`── ${n?r:e} ──`}),a.forEach(e=>{t.push({kind:'out',text:`  ${e.padEnd(10)}${y(e)}`})})}),t.push({kind:'sys',text:'── END ──'}),t}},status:{usage:'status',desc:'show system state',run:()=>[{kind:'out',text:`power: ${n.data.千鹤.电源状态}`},{kind:'out',text:`consciousness: ${n.data.千鹤.意识状态}`},{kind:'out',text:`system: ${n.data.千鹤.系统状态}`},{kind:'out',text:`affection: ${n.data.千鹤.好感度}/100`},{kind:'out',text:`cpu: ${ng(n.data.千鹤.cpu使用率)}%  ram: ${tg(n.data.千鹤.内存使用率)}%  battery: ${eg(n.data.千鹤.电量)}%`}]},info:{usage:'info',desc:'show system information',run:()=>[{kind:'out',text:'── SYSTEM INFORMATION ──'},{kind:'out',text:'os: KurenaiOS 3.2.1'},{kind:'out',text:'fi