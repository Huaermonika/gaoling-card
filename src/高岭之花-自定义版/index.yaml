md-id {\r\n  font-family: var(--font-mono);\r\n  font-size: 11px;\r\n  color: var(--accent);\r\n  font-weight: 700;\r\n  flex-shrink: 0;\r\n}\r\n\r\n.cmd-pri {\r\n  font-family: var(--font-mono);\r\n  font-size: 10px;\r\n  color: var(--muted);\r\n  flex-shrink: 0;\r\n  padding: 1px 7px;\r\n  border-radius: 999px;\r\n  border: 1px solid var(--line-2);\r\n  background: var(--bg-2);\r\n\r\n  &.high {\r\n    color: var(--red);\r\n    border-color: var(--red);\r\n    background: color-mix(in srgb, var(--red) 10%, transparent);\r\n    font-weight: 700;\r\n  }\r\n}\r\n\r\n.cmd-content {\r\n  font-size: 12px;\r\n  color: var(--text);\r\n  flex: 1;\r\n}\r\n\r\n.cmd-del {\r\n  width: 20px;\r\n  height: 20px;\r\n  flex-shrink: 0;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  background: transparent;\r\n  border: 1px solid var(--line-2);\r\n  border-radius: 6px;\r\n  color: var(--muted);\r\n  cursor: pointer;\r\n  font-size: 11px;\r\n  transition: all 0.2s;\r\n}\r\n\r\n.cmd-del:hover {\r\n  color: var(--red);\r\n  border-color: var(--red);\r\n}\r\n\r\n.cmd-empty {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  gap: 8px;\r\n  color: var(--muted);\r\n  font-size: 12px;\r\n  padding: 34px 18px;\r\n  border: 1px dashed var(--line-2);\r\n  border-radius: 12px;\r\n  background: color-mix(in srgb, var(--panel-2) 60%, transparent);\r\n}\r\n\r\n.cmd-empty-ico {\r\n  color: var(--amber);\r\n  line-height: 1;\r\n\r\n  svg {\r\n    width: 22px;\r\n    height: 22px;\r\n    display: block;\r\n  }\r\n}\r\n\r\n.cmd-empty-title {\r\n  font-size: 13px;\r\n  font-weight: 700;\r\n  color: var(--text);\r\n}\r\n\r\n.cmd-empty-hint {\r\n  font-size: 11px;\r\n  color: var(--muted);\r\n}\r\n\r\n/* ===== 指令添加 ===== */\r\n.cmd-add {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 8px;\r\n}\r\n\r\n.cmd-add-row {\r\n  display: flex;\r\n  gap: 8px;\r\n}\r\n\r\n.cmd-input {\r\n  width: 100%;\r\n  padding: 10px 12px;\r\n  backgroun