GF,oCACE,2EAAA,CAGF,+BACE,gBAAA,CACA,kBAAA,CACA,kBAAA,CACA,oBAAA,CAGF,sCACE,mBAAA,CAMF,0BACE,YAAA,CACA,kBAAA,CACA,6BAAA,CACA,iBAAA,CACA,0DAAA,CACA,mCAAA,CACA,aAAA,CAGF,2BACE,YAAA,CACA,kBAAA,CACA,QAAA,CAGF,0BACE,UAAA,CACA,WAAA,CACA,kBAAA,CACA,aAAA,CACA,YAAA,CACA,kBAAA,CACA,sBAAA,CACA,cAAA,CACA,UAAA,CACA,kEAAA,CACA,sEAAA,CAGF,gCACE,YAAA,CACA,qBAAA,CACA,OAAA,CAGF,0BACE,cAAA,CACA,eAAA,CACA,kBAAA,CAGF,2BACE,gBAAA,CACA,kBAAA,CACA,4BAAA,CACA,kBAAA,CAGF,yBACE,YAAA,CACA,OAAA,CAGF,gCACE,gBAAA,CACA,kBAAA,CACA,8BAAA,CACA,wBAAA,CACA,kBAAA,CACA,cAAA,CACA,eAAA,CACA,cAAA,CACA,mBAAA,CACA,kBAAA,CAGF,sCACE,iBAAA,CACA,yBAAA,CAGF,uCACE,mBAAA,CACA,4BAAA,CACA,wBAAA,CAGF,0BACE,MAAA,CACA,YAAA,CACA,mBAAA,CACA,YAAA,CAGF,yBACE,WAAA,CAGF,8BACE,YAAA,CACA,kCAAA,CACA,YAAA,CACA,qBAAA,CACA,0DAAA,CACA,YAAA,CAIF,+BACE,MAAA,CACA,YAAA,CACA,YAAA,CACA,qBAAA,CACA,mBAAA,CAGF,8BACE,YAAA,CACA,YAAA,CACA,qBAAA,CACA,uBAAA,CAGF,2BACE,MAAA,CACA,YAAA,CACA,eAAA,CACA,sBAAA,CACA,uBAAA,CAGF,0BACE,aAAA,CAGF,8BACE,MAAA,CACA,eAAA,CACA,sBAAA,CACA,YAAA,CACA,qBAAA,CACA,QAAA,CACA,eAAA,CACA,aAAA,CACA,UAAA,CAKF,qGAEE,eAAA,CACA,cAAA,CAGF,yCACE,eAAA,CAIF,sCACE,UAAA,CACA,WAAA,CAGF,2CACE,UAAA,CACA,WAAA,CAGF,sDACE,0BAAA,CAGF,yFAEE,eAAA',sourcesContent:['\n.phone {\n  /* 主题变量由 inline style 注入（见 phoneVars）；此处只声明基础字体 */\n  --font-ui: system-ui, -apple-system, \'Segoe UI\', \'Microsoft YaHei\', \'PingFang SC\', sans-serif;\n  --font-mono: \'JetBrains Mono\', \'Cascadia Code\', \'Courier New\', monospace;\n\n  position: relative;\n  width: 100%;\n  max-width: var(--phone-maxw, 440px);\n  margin: 0 auto;\n  min-height: var(--phone-minh, 560px);\n  max-height: min(var(--phone-maxh, 920px), 95vh);\n  zoom: var(--ui-zoom, 1);\n  background: var(--bg);\n  border: 1px solid var(--line-2);\n  border-radius: calc(var(--radius) + 8px);\n  box-shadow: var(--shadow);\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  font-family: var(--font-ui);\n  color: var(--text);\n  transition: background 0.35s ease, color 0.35s ease;\n}\n\n/* PC 形态：铺满宽屏，无手机壳约束。\n   高度用固定像素锁定（iframe 内 100vh 等于 iframe 自身高度，会与自动撑高脚本互相追逐，导致首屏塌缩成 1cm 或无限拉长），\n   内部面板各自滚动。 */\n.phone.desktop {\n  max-width: 100%;\n  height: 820px;\n  max-height: none;\n  min-height: 0;\n  border-radius: 0;\n  border: none;\n  box-shadow: none;\n}\n\n/* ===== 氛围光斑 ===== */\n.phone-deco {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  overflow: hidden;\n  z-index: 0;\n}\n\n.deco-blob {\n  position: absolute;\n  border-radius: 50%;\n  filter: blur(46px);\n  transition: background 0.35s ease;\n}\n\n.deco-a {\n  width: 230px;\n  height: 230px;\n  background: var(--deco-a);\n  top: -70px;\n  right: -60px;\n}\n\n.deco-b {\n  width: 190px;\n  height: 190px;\n  background: var(--deco-b);\n  bottom: -50px;\n  left: -50px;\n}\n\n.deco-c {\n  width: 130px;\n  height: 130px;\n  background: var(--deco-c);\n  top: 34%;\n  left: -40px;\n}\n\n/* ===== 屏幕主体 ===== */\n.phone-screen {\n  position: relative;\n  z-index: 1;\n  display: flex;\n  flex-direction: column;\n  flex: 1;\n  min-height: 0;\n}\n\n.view {\n  animation: fade-in 0.25s ease;\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  min-height: 0;\n}\n\n@keyframes fade-in {\n  from {\n    opacity: 0;\n    transform: translateY(4px);\n  }\n\n  to {\n    opacity: 1;\n    transform: translateY(0);\n  }\n}\n.status-update {\n  width: 100%;\n  padding: 10px;\n  margin-bottom: 10px;\n  background: var(--accent);\n  color: #fff;\n  border-radius: 8px;\n  font-weight: 700;\n  font-size: 13px;\n  cursor: pointer;\n  border: none;\n}\n\n.status-update:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n.chat-view {\n  display: flex;\n  flex-direction: column;\n}\n\n.chat-head {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 16px 18px 13px;\n  border-bottom: 1px solid var(--line);\n  background: color-mix(in srgb, var(--panel) 72%, transparent);\n  flex-shrink: 0;\n}\n\n.avatar {\n  position: relative;\n  width: 44px;\n  height: 44px;\n  border-radius: 50%;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  background: linear-gradient(135deg, var(--avatar-a), var(--avatar-b));\n  color: #fff;\n  font-size: 18px;\n  font-weight: 700;\n  box-shadow: 0 5px 16px color-mix(in srgb, var(--accent) 38%, transparent);\n}\n\n.avatar-char {\n  line-height: 1;\n}\n\n.avatar-img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  border-radius: inherit;\n  display: block;\n}\n\n.avatar::after {\n  content: \'\';\n  position: absolute;\n  right: -1px;\n  bottom: -1px;\n  width: 12px;\n  height: 12px;\n  border-radius: 50%;\n  background: var(--green);\n  border: 2px solid var(--panel);\n}\n\n.avatar.is-stopped::after {\n  background: var(--red);\n}\n\n.avatar.is-frozen::after {\n  background: var(--blue);\n}\n\n.chat-head-info {\n  flex: 1;\n  min-width: 0;\n}\n\n.chat-name {\n  font-size: 15px;\n  font-weight: 700;\n  letter-spacing: 1px;\n}\n\n.chat-sub {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 11px;\n  color: var(--muted);\n  margin-top: 2px;\n}\n\n.sub-dot {\n  width: 7px;\n  height: 7px;\n  border-radius: 50%;\n  background: var(--green);\n  flex-shrink: 0;\n}\n\n.sub-dot.is-stopped {\n  background: var(--red);\n}\n\n.sub-dot.is-frozen {\n  background: var(--blue);\n}\n\n.chat-time {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  color: var(--muted);\n  letter-spacing: 1px;\n}\n\n.chat-body {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n  padding: 16px 18px 0;\n}\n\n.chat-scroll {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  display: flex;\n  flex-direction: column;\n}\n\n.chat-label {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--font-mono);\n  font-size: 10px;\n  letter-spacing: 2px;\n  color: var(--muted);\n  margin-bottom: 13px;\n}\n\n.label-line {\n  flex: 1;\n  height: 1px;\n  background: linear-gradient(90deg, transparent, var(--line), transparent);\n}\n\n.chat-bubble {\n  font-size: var(--chat-font-size);\n  line-height: 1.9;\n  letter-spacing: 0.01em;\n  color: var(--text);\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-left: 3px solid var(--accent);\n  border-radius: 6px 16px 16px 16px;\n  padding: 14px 16px;\n  box-shadow: 0 8px 22px -16px color-mix(in srgb, var(--accent) 55%, transparent);\n}\n\n.chat-bubble :deep(p) {\n  margin: 0 0 0.6rem;\n}\n\n.chat-bubble :deep(p:last-child) {\n  margin-bottom: 0;\n}\n\n.chat-bubble :deep(strong) {\n  color: var(--accent);\n  font-weight: 700;\n}\n\n.chat-bubble :deep(em) {\n  font-style: italic;\n  opacity: 0.9;\n}\n\n.chat-bubble :deep(code) {\n  font-family: var(--font-mono);\n  font-size: 0.86em;\n  background: var(--accent-dim);\n  padding: 0.05em 0.4em;\n  border-radius: 4px;\n}\n\n.chat-bubble :deep(del) {\n  opacity: 0.6;\n}\n\n.chat-compose {\n  display: flex;\n  gap: 8px;\n  margin-top: 14px;\n  flex-shrink: 0;\n}\n\n.chat-compose input {\n  flex: 1;\n  min-width: 0;\n  height: 36px;\n  background: var(--panel-2);\n  border: 1px solid var(--line);\n  border-radius: 18px;\n  padding: 0 14px;\n  color: var(--text);\n  font-family: inherit;\n  font-size: 13px;\n  outline: none;\n  transition: border-color 0.2s;\n}\n\n.chat-compose input:focus {\n  border-color: var(--accent);\n}\n\n.chat-compose button {\n  height: 36px;\n  padding: 0 16px;\n  border-radius: 18px;\n  background: var(--accent);\n  color: #fff;\n  font-weight: 700;\n  font-size: 13px;\n  cursor: pointer;\n  border: none;\n  transition: opacity 0.2s;\n}\n\n.chat-compose button:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n.chat-foot {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 6px;\n  flex-shrink: 0;\n  padding: 14px 0 18px;\n  font-family: var(--font-mono);\n  font-size: 9.5px;\n  letter-spacing: 1px;\n  color: var(--muted);\n  opacity: 0.75;\n}\n\n.foot-dot {\n  width: 4px;\n  height: 4px;\n  border-radius: 50%;\n  background: var(--accent);\n}\n\n/* =========================================================\n   APP 控制终端视图\n   ========================================================= */\n.app-view {\n  display: flex;\n  flex-direction: column;\n}\n\n.app-head {\n  padding: 14px 16px 12px;\n  background: color-mix(in srgb, var(--panel) 62%, var(--bg-2));\n  border-bottom: 1px solid var(--line);\n  display: flex;\n  flex-direction: column;\n  gap: 11px;\n  flex-shrink: 0;\n}\n\n.app-head-row {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n\n.app-brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  cursor: pointer;\n}\n\n.brand-caret {\n  font-style: normal;\n  color: var(--muted);\n  margin-left: 2px;\n}\n\n.switch-hint {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 6px 10px;\n  border: 1px dashed var(--accent);\n  border-radius: 8px;\n  background: color-mix(in srgb, var(--accent) 8%, transparent);\n  color: var(--accent);\n  font-size: 11px;\n  cursor: pointer;\n\n  b {\n    margin-left: auto;\n    font-weight: 600;\n    font-size: 10.5px;\n  }\n}\n\n.app-logo {\n  width: 38px;\n  height: 38px;\n  border-radius: 12px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 16px;\n  color: #fff;\n  background: linear-gradient(135deg, var(--avatar-a), var(--avatar-b));\n  background-size: cover;\n  background-position: center;\n  box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 32%, transparent);\n}\n\n.app-brand-text {\n  display: flex;\n  flex-direction: column;\n  gap: 1px;\n}\n\n.app-name {\n  font-size: 15px;\n  font-weight: 700;\n  letter-spacing: 1px;\n}\n\n.app-model {\n  font-size: 10px;\n  color: var(--muted);\n  font-family: var(--font-mono);\n  letter-spacing: 1px;\n}\n\n.app-state {\n  padding: 4px 12px;\n  border-radius: 999px;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 1px;\n  border: 1px solid;\n  white-space: nowrap;\n\n  &.is-running {\n    color