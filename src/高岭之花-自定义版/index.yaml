oh-overlay {\n  position: absolute;\n  inset: 0;\n  z-index: 70;\n  background: var(--bg);\n  color: var(--text);\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n}\n\n.oh-top {\n  flex-shrink: 0;\n  display: flex;\n  align-items: flex-end;\n  justify-content: space-between;\n  padding: 16px 18px 10px;\n\n  b {\n    font-size: 16px;\n    letter-spacing: 2px;\n  }\n\n  span {\n    display: block;\n    margin-top: 3px;\n    font-size: 10px;\n    color: var(--muted);\n  }\n}\n\n.oh-version {\n  font-size: 9px;\n  letter-spacing: 2px;\n  color: var(--muted);\n}\n\n.oh-pager {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  gap: 12px;\n  padding: 8px 18px 0;\n  overflow-x: auto;\n  overflow-y: hidden;\n  scroll-snap-type: x mandatory;\n  scrollbar-width: none;\n\n  &::-webkit-scrollbar {\n    display: none;\n  }\n}\n\n.oh-page {\n  flex: 0 0 calc(100% - 6px);\n  scroll-snap-align: start;\n  display: flex;\n  flex-direction: column;\n  border: 1px solid var(--line);\n  border-radius: 16px;\n  background: var(--panel);\n  overflow: hidden;\n  min-height: 0;\n}\n\n.oh-cover {\n  position: relative;\n  flex: 1;\n  min-height: 0;\n  background: var(--panel-2);\n  background-size: cover;\n  background-position: center top;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n\n.oh-page.custom .oh-cover {\n  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 10%, var(--panel)), var(--panel-2));\n}\n\n.oh-page.manage .oh-cover {\n  background: var(--bg-2);\n}\n\n.oh-cover-empty {\n  font-size: 30px;\n  color: color-mix(in srgb, var(--accent) 55%, var(--muted));\n}\n\n.oh-placeholder {\n  width: auto;\n  height: auto;\n  border: 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  position: relative;\n\n  b {\n    font-family: Georgia, \'Songti SC\', \'SimSun\', serif;\n    font-size: 32px;\n    font-weight: 500;\n    letter-spacing: 8px;\n    color: var(--text);\n  }\n\n  small {\n    font-size: 10px;\n    letter-spacing: 2px;\n    color: var(--muted);\n  }\n}\n\n.oh-page.custom .oh-shade {\n  background: linear-gradient(to bottom, transparent 56%, rgba(20, 16, 12, 0.6) 100%);\n}\n\n.oh-page.manage .oh-shade {\n  background: linear-gradient(to bottom, transparent 58%, rgba(20, 16, 12, 0.55) 100%);\n}\n\n.oh-page.manage .oh-placeholder {\n  border-style: none;\n}\n\n.oh-ph-label {\n  font-size: 8px;\n  letter-spacing: 4px;\n  color: var(--accent);\n}\n\n.oh-badge {\n  position: absolute;\n  top: 10px;\n  right: 10px;\n  padding: 5px 12px;\n  border-radius: 999px;\n  background: color-mix(in srgb, var(--accent) 85%, transparent);\n  color: #fff;\n  font-size: 11px;\n  letter-spacing: 1px;\n}\n\n.oh-page-body {\n  flex-shrink: 0;\n  padding: 12px 14px 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n  border-top: 1px solid var(--line);\n}\n\n.oh-kicker {\n  font-size: 8.5px;\n  letter-spacing: 2px;\n  color: var(--accent);\n  text-transform: uppercase;\n}\n\n.oh-page-body h2 {\n  margin: 0;\n  font-size: 20px;\n  letter-spacing: 1px;\n}\n\n.oh-page-body p {\n  margin: 0 0 6px;\n  font-size: 10.5px;\n  line-height: 1.6;\n  color: var(--muted);\n}\n\n.oh-btn {\n  border: 1px solid var(--line);\n  background: var(--panel-2);\n  color: var(--text);\n  border-radius: 9px;\n  padding: 8px 14px;\n  font-size: 11.5px;\n  font-family: inherit;\n  cursor: pointer;\n\n  &.primary {\n    background: var(--accent);\n    border-color: var(--accent);\n    color: #fff;\n  }\n\n  &:disabled {\n    opacity: 0.55;\n    cursor: default;\n  }\n}\n\n.oh-dots {\n  flex-shrink: 0;\n  display: flex;\n  justify-content: center;\n  gap: 5px;\n  padding: 8px 0 2px;\n}\n\n.oh-dot {\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  border: 0;\n  padding: 0;\n  background: var(--line-2);\n  cursor: pointer;\n\n  &.active {\n    background: var(--accent);\n  }\n}\n\n.oh-recent {\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  padding: 6px 18px calc(10px + env(safe-area-inset-bottom));\n  font-size: 9px;\n  color: var(--muted);\n  overflow-x: auto;\n  white-space: nowrap;\n\n  button {\n    border: 1px solid var(--line);\n    background: transparent;\n    color: var(--text);\n    border-radius: 999px;\n    padding: 3px 8px;\n    font-size: 9px;\n    font-family: inherit;\n    cursor: pointer;\n  }\n}\n\n.oh-sub-head {\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 12px 14px;\n  border-bottom: 1px solid var(--line);\n\n  b {\n    font-size: 14px;\n    letter-spacing: 1px;\n  }\n}\n\n.oh-back {\n  border: 1px solid var(--line);\n  background: var(--panel-2);\n  color: var(--text);\n  border-radius: 7px;\n  padding: 4px 8px;\n  font-size: 10px;\n  font-family: inherit;\n  cursor: pointer;\n}\n\n.oh-tag {\n  margin-left: auto;\n  padding: 4px 11px;\n  border: 1px solid var(--accent);\n  border-radius: 999px;\n  color: var(--accent);\n  font-size: 10.5px;\n  letter-spacing: 1px;\n}\n\n.oh-save {\n  margin-left: auto;\n  font-size: 9px;\n  color: var(--muted);\n\n  &.saving {\n    color: var(--accent);\n  }\n}\n\n.oh-sub-body {\n  flex: 1;\n  min-height: 0;\n  overflow-y: auto;\n  padding: 12px 14px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.oh-hero {\n  display: flex;\n  gap: 10px;\n}\n\n.oh-hero-img {\n  width: 76px;\n  height: 96px;\n  flex-shrink: 0;\n  border-radius: 10px;\n  background: var(--panel-2);\n  background-size: cover;\n  background-position: center top;\n}\n\n.oh-hero-text {\n  min-width: 0;\n\n  h2 {\n    margin: 0;\n    font-size: 17px;\n  }\n\n  span {\n    font-size: 9.5px;\n    color: var(--muted);\n  }\n\n  p {\n    margin: 6px 0 0;\n    font-size: 10px;\n    line-height: 1.55;\n    color: var(--muted);\n  }\n}\n\n.oh-rows {\n  display: flex;\n  flex-direction: column;\n  gap: 5px;\n\n  div {\n    display: flex;\n    gap: 8px;\n    font-size: 10px;\n    line-height: 1.55;\n  }\n\n  span {\n    flex: 0 0 28px;\n    color: var(--muted);\n  }\n\n  p {\n    margin: 0;\n  }\n}\n\n.oh-section {\n  font-size: 9px;\n  letter-spacing: 2px;\n  color: var(--muted);\n  margin-top: 2px;\n}\n\n.oh-stories {\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n\n.oh-story {\n  text-align: left;\n  border: 1px solid var(--line);\n  border-radius: 9px;\n  background: var(--panel);\n  padding: 8px 10px;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n  font-family: inherit;\n  color: var(--text);\n  cursor: pointer;\n\n  b {\n    font-size: 11.5px;\n  }\n\n  span {\n    font-size: 9.5px;\n    color: var(--muted);\n  }\n\n  &.active {\n    border-color: var(--accent);\n    background: color-mix(in srgb, var(--accent) 7%, var(--panel));\n  }\n}\n\n.oh-preview {\n  border: 1px dashed var(--line-2);\n  border-radius: 9px;\n  padding: 8px 10px;\n\n  span {\n    font-size: 8.5px;\n    letter-spacing: 1px;\n    color: var(--muted);\n  }\n\n  p {\n    margin: 4px 0 0;\n    font-size: 10.5px;\n    line-height: 1.65;\n    white-space: pre-wrap;\n  }\n}\n\n.oh-foot {\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 9px 14px calc(12px + env(safe-area-inset-bottom));\n  border-top: 1px solid var(--line);\n}\n\n.oh-hint {\n  flex: 1;\n  font-size: 8.5px;\n  color: var(--muted);\n  line-height: 1.4;\n}\n\n.oh-editor {\n  flex: 1;\n  min-height: 0;\n  display: flex;\n  flex-direction: column;\n}\n\n.oh-line {\n  flex-shrink: 0;\n  display: flex;\n  align-items: flex-start;\n  padding: 14px 10px 6px;\n  border-bottom: 1px solid var(--line);\n  position: relative;\n\n  &::before {\n    content: \'\';\n    position: absolute;\n    left: 32px;\n    right: 32px;\n    top: 18px;\n    height: 1px;\n    background: var(--line-2);\n  }\n\n  button {\n    position: relative;\n    z-index: 1;\n    flex: 1;\n    min-width: 0;\n    border: 0;\n    background: transparent;\n    color: var(--muted);\n    padding: 0;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 6px;\n    font-size: 10px;\n    font-family: inherit;\n    cursor: pointer;\n  }\n\n  i {\n    width: 9px;\n    height: 9px;\n    border-radius: 50%;\n    background: var(--bg);\n    border: 1px solid var(--line-2);\n  }\n\n  button.done i {\n    background: var(--green);\n    border-color: var(--green);\n  }\n\n  button.active i {\n    background: var(--accent);\n    border-color: var(--accent);\n    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);\n  }\n\n  button.active span {\n    color: var(--accent);\n  }\n}\n\n.oh-rail {\n  flex: 0 0 78px;\n  border-right: 1px solid var(--line);\n  padding: 8px 5px;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n\n  button {\n    border: 0;\n    background: transparent;\n    color: var(--muted);\n    border-radius: 7px;\n    padding: 7px 5px;\n    font-size: 9.5px;\n    font-family: inherit;\n    text-align: left;\n    display: flex;\n    align-items: center;\n    gap: 5px;\n    cursor: pointer;\n\n    &.active {\n      background: color-mix(in srgb, var(--accent) 10%, var(--panel));\n      color: var(--accent);\n    }\n  }\n\n  i {\n    width: 5px;\n    height: 5px;\n    border-radius: 50%;\n    background: var(--line-2);\n    flex-shrink: 0;\n  }\n\n  button.done i {\n    background: var(--green);\n  }\n}\n\n.oh-form {\n  flex: 1;\n  min-width: 0;\n  overflow-y: auto;\n  padding: 10px 12px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.oh-avatar-row {\n  display: flex;\n  gap: 10px;\n  align-items: center;\n}\n\n.oh-avatar {\n  width: 54px;\n  height: 64px;\n  flex-shrink: 0;\n  border-radius: 10px;\n  background: linear-gradient(135deg, var(--avatar-a), var(--avatar-b));\n  background-size: cover;\n  background-position: center;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: #fff;\n  font-size: 18px;\n  font-weight: 700;\n  overflow: hidden;\n}\n\n.oh-avatar-ops {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 5px;\n\n  small {\n    flex-basis: 100%;\n    font-size: 8.5px;\n    color: var(--muted);\n    line-height: 1.4;\n  }\n}\n\n.oh-mini {\n  border: 1px solid var(--line);\n  background: var(--panel-2);\n  color: var(--muted);\n  border-radius: 6px;\n  padding: 4px 7px;\n  font-size: 9px;\n  font-family: inherit;\n  cursor: pointer;\n\n  &.danger {\n    color: var(--red);\n    border-color: color-mix(in srgb, var(--red) 40%, var(--line));\n  }\n}\n\n.oh-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 7px;\n}\n\n.oh-field {\n  display: flex;\n  flex-direction: column;\n  gap: 3px;\n\n  > span {\n    font-size: 9px;\n    color: var(--muted);\n\n    i {\n      font-style: normal;\n      color: var(--accent);\n    }\n  }\n\n  input,\n  textarea {\n    width: 100%;\n    box-sizing: border-box;\n    border: 1px solid var(--line);\n    border-radius: 7px;\n    background: var(--panel);\n    color: var(--text);\n    padding: 6px 8px;\n    font-size: 10.5px;\n    font-family: inherit;\n    line-height: 1.5;\n    resize: vertical;\n  }\n}\n\n.oh-note {\n  margin: 0;\n  font-size: 9px;\n  color: var(--muted);\n  line-height: 1.6;\n}\n\n.oh-memory {\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n\n  div {\n    border: 1px solid var(--line);\n    border-radius: 8px;\n    background: var(--panel);\n    padding: 7px 9px;\n  }\n\n  span {\n    font-size: 8.5px;\n    color: var(--muted);\n  }\n\n  p {\n    margin: 3px 0 0;\n    font-size: 10px;\n  }\n}\n\n.oh-summary {\n  display: flex;\n  flex-direction: column;\n  gap: 5px;\n  border: 1px solid var(--line);\n  border-radius: 9px;\n  padding: 9px 10px;\n\n  div {\n    display: flex;\n    gap: 8px;\n    font-size: 10.5px;\n  }\n\n  span {\n    flex: 0 0 34px;\n    color: var(--muted);\n  }\n}\n\n.oh-error {\n  margin: 0;\n  font-size: 10px;\n  color: var(--red);\n}\n\n.oh-manage-actions {\n  margin-left: auto;\n  display: flex;\n  gap: 6px;\n\n  .oh-mini {\n    padding: 7px 12px;\n    font-size: 11px;\n    border-radius: 8px;\n  }\n}\n\n.oh-workshop {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 8px;\n  padding: 30px 18px;\n  border: 1px dashed var(--line-2);\n  border-radius: 12px;\n  text-align: center;\n  color: var(--muted);\n\n  b {\n    font-size: 15px;\n    color: var(--text);\n  }\n\n  p {\n    margin: 0;\n    max-width: 260px;\n    font-size: 11.5px;\n    line-height: 1.7;\n  }\n\n  span {\n    font-size: 10px;\n    letter-spacing: 1px;\n    color: var(--accent);\n  }\n}\n\n.oh-lib-tabs {\n  display: flex;\n  gap: 6px;\n}\n\n.oh-filter {\n  border: 1px solid var(--line);\n  background: var(--panel);\n  color: var(--muted);\n  border-radius: 999px;\n  padding: 6px 12px;\n  font-size: 11px;\n  font-family: inherit;\n  cursor: pointer;\n\n  i {\n    font-style: normal;\n    margin-left: 3px;\n    opacity: 0.7;\n  }\n\n  &.active {\n    color: var(--accent);\n    border-color: var(--accent);\n    background: color-mix(in srgb, var(--accent) 8%, var(--panel));\n  }\n}\n\n.oh-lib-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n}\n\n.oh-card {\n  border: 1px solid var(--line);\n  border-radius: 12px;\n  background: var(--panel);\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n}\n\n.oh-card-main {\n  border: 0;\n  background: transparent;\n  padding: 0;\n  text-align: left;\n  font-family: inherit;\n  color: var(--text);\n  cursor: pointer;\n}\n\n.oh-card-cover {\n  height: 120px;\n  background: var(--panel-2);\n  background-size: cover;\n  background-position: center top;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--muted);\n  font-size: 26px;\n  font-weight: 700;\n}\n\n.oh-card-info {\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n  padding: 8px 9px;\n\n  b {\n    font-size: 13px;\n  }\n\n  span {\n    font-size: 10px;\n    color: var(--muted);\n  }\n\n  em {\n    font-style: normal;\n  