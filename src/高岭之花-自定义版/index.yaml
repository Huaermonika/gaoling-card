th-child(3) {\r\n      background: var(--green);\r\n    }\r\n  }\r\n}\r\n\r\n.log-filename {\r\n  flex: 1;\r\n  font-size: 11px;\r\n  color: var(--muted);\r\n  letter-spacing: 0.5px;\r\n}\r\n\r\n.log-live {\r\n  font-size: 10px;\r\n  color: var(--green);\r\n  letter-spacing: 1px;\r\n}\r\n\r\n.log-body {\r\n  max-height: 260px;\r\n  overflow-y: auto;\r\n  padding: 10px 12px;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 3px;\r\n}\r\n\r\n.log-line {\r\n  display: flex;\r\n  gap: 8px;\r\n  font-size: 11px;\r\n  line-height: 1.5;\r\n\r\n  .log-time {\r\n    color: var(--muted);\r\n    opacity: 0.75;\r\n    flex-shrink: 0;\r\n  }\r\n\r\n  .log-level {\r\n    flex-shrink: 0;\r\n    width: 48px;\r\n    font-weight: 700;\r\n  }\r\n\r\n  .log-event {\r\n    color: var(--text);\r\n    word-break: break-all;\r\n  }\r\n\r\n  &.lv-info .log-level {\r\n    color: var(--green);\r\n  }\r\n\r\n  &.lv-warn .log-level {\r\n    color: var(--amber);\r\n  }\r\n\r\n  &.lv-error {\r\n    .log-level {\r\n      color: var(--red);\r\n    }\r\n\r\n    .log-event {\r\n      color: var(--red);\r\n    }\r\n  }\r\n\r\n  &.lv-debug .log-level {\r\n    color: var(--blue);\r\n  }\r\n}\r\n\r\n.log-empty {\r\n  text-align: center;\r\n  color: var(--muted);\r\n  font-size: 11px;\r\n  padding: 20px;\r\n}\r\n'],sourceRoot:''}]);const i=A;t.d(n,['default',0,i])},75(e,n,t){t.r(n);var r=t(220),a=t.n(r),o=t(716),A=t.n(o)()(a());A.push([e.id,'.phone[data-v-7d2f651f]{--font-ui:system-ui,-apple-system,\'Segoe UI\',\'Microsoft YaHei\',\'PingFang SC\',sans-serif;--font-mono:\'JetBrains Mono\',\'Cascadia Code\',\'Courier New\',monospace;position:relative;width:100%;max-width:var(--phone-maxw,440px);margin:0 auto;min-height:var(--phone-minh,560px);max-height:min(var(--phone-maxh,920px),95vh);zoom:var(--ui-zoom,1);background:var(--bg);border:1px solid var(--line-2);border-radius:calc(var(--radius) + 8px);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;font-family:var(--font-ui