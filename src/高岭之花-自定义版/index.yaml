ackground: var(--bg);\n  overflow: hidden;\n}\n\n.oh-cover {\n  flex: 0 0 58%;\n  height: auto;\n  position: relative;\n  border-radius: 0;\n}\n\n.oh-page-caption {\n  position: relative;\n  flex: 1;\n  min-height: 0;\n  padding: 18px 22px calc(30px + env(safe-area-inset-bottom));\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  align-items: flex-start;\n  gap: 6px;\n  color: var(--text);\n  background: var(--bg);\n\n  .oh-kicker {\n    color: var(--accent);\n  }\n\n  h2 {\n    margin: 0;\n    font-size: 28px;\n    font-weight: 600;\n    letter-spacing: 1px;\n    color: var(--text);\n  }\n\n  p {\n    margin: 0 0 4px;\n    max-width: 100%;\n    font-size: 13px;\n    line-height: 1.75;\n    color: var(--muted);\n  }\n\n  .oh-btn {\n    margin-top: 14px;\n    width: 100%;\n  }\n}\n\n.oh-page-meta {\n  font-size: 10px;\n  letter-spacing: 1px;\n  color: var(--muted);\n}\n\n.oh-shade {\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(to bottom, transparent 32%, rgba(20, 16, 12, 0.74) 100%);\n  pointer-events: none;\n}\n\n.oh-btn.big {\n  padding: 11px 26px;\n  font-size: 14px;\n  border-radius: 10px;\n}\n\n.oh-nav {\n  position: absolute;\n  top: 50%;\n  transform: translateY(-50%);\n  z-index: 6;\n  width: 38px;\n  height: 66px;\n  border: 0;\n  background: rgba(38, 33, 27, 0.28);\n  color: #fff;\n  font-size: 30px;\n  line-height: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  cursor: pointer;\n  backdrop-filter: blur(6px);\n\n  &.prev {\n    left: 0;\n    border-radius: 0 12px 12px 0;\n  }\n\n  &.next {\n    right: 0;\n    border-radius: 12px 0 0 12px;\n  }\n\n  &:disabled {\n    opacity: 0;\n    pointer-events: none;\n  }\n}\n\n.oh-dots {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 9px;\n  z-index: 7;\n  padding: 0;\n}\n\n.oh-dot {\n  width: 7px;\n  height: 7px;\n  background: var(--line-2);\n\n  &.active {\n    background: var(--accent);\n  }\n}\n\n/* 官方页 */\n.oh-official-hero {\n  position: relative;\n  flex-shrink: 0;\n  height: 246px;\n  background-color: var(--panel-2);\n  background-size: cover;\n  background-position: center 28%;\n}\n\n.oh-official-hero .oh-shade {\n  background: linear-gradient(to bottom, rgba(20, 16, 12, 0.32), transparent 32%);\n}\n\n.oh-official-title {\n  flex-shrink: 0;\n  padding: 12px 18px 0;\n\n  h2 {\n    display: inline-block;\n    margin: 0;\n    font-size: 30px;\n    letter-spacing: 1px;\n  }\n\n  span {\n    margin-left: 10px;\n    font-size: 11px;\n    color: var(--muted);\n  }\n}\n\n.oh-official-desc {\n  margin: 0;\n  font-size: 12px;\n  line-height: 1.7;\n  color: var(--muted);\n}\n\n.oh-back.floating {\n  position: absolute;\n  left: 14px;\n  top: 14px;\n  z-index: 3;\n  background: rgba(255, 253, 247, 0.82);\n}\n\n.oh-tag.floating {\n  position: absolute;\n  right: 14px;\n  top: 16px;\n  z-index: 3;\n  background: rgba(255, 253, 247, 0.82);\n}\n\n.oh-official-name {\n  position: absolute;\n  left: 18px;\n  right: 18px;\n  bottom: 16px;\n  z-index: 3;\n\n  h2 {\n    margin: 0;\n    font-size: 30px;\n    letter-spacing: 1px;\n  }\n\n  span {\n    font-size: 11px;\n    color: var(--muted);\n  }\n\n  p {\n    margin: 6px 0 0;\n    max-width: 92%;\n    font-size: 11.5px;\n    line-height: 1.6;\n    color: var(--muted);\n  }\n}\n\n.oh-story-tabs {\n  display: flex;\n  gap: 6px;\n}\n\n.oh-story-tab {\n  flex: 1;\n  min-width: 0;\n  border: 1px solid var(--line);\n  border-radius: 9px;\n  background: var(--panel);\n  padding: 9px 5px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 2px;\n  font-family: inherit;\n  color: var(--text);\n  cursor: pointer;\n\n  b {\n    font-size: 12.5px;\n    line-height: 1.3;\n  }\n\n  span {\n    font-size: 9px;\n    color: var(--muted);\n    line-height: 1.3;\n  }\n\n  &.active {\n    border-color: var(--accent);\n    background: color-mix(in srgb, var(--accent) 8%, var(--panel));\n  }\n}\n\n.oh-dossier {\n  border: 1px solid var(--line);\n  