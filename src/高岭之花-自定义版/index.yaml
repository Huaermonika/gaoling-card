\r\n  position: absolute;\r\n  top: 10px;\r\n  right: 10px;\r\n  width: 7px;\r\n  height: 7px;\r\n  border-radius: 50%;\r\n  background: var(--green);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 18%, transparent);\r\n}\r\n\r\n.core-cell.is-running .core-value {\r\n  color: var(--green);\r\n}\r\n\r\n.core-cell.is-running .core-dot {\r\n  background: var(--green);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 18%, transparent);\r\n}\r\n\r\n.core-cell.is-stopped .core-value {\r\n  color: var(--red);\r\n}\r\n\r\n.core-cell.is-stopped .core-dot {\r\n  background: var(--red);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent);\r\n}\r\n\r\n.core-cell.is-frozen .core-value {\r\n  color: var(--blue);\r\n}\r\n\r\n.core-cell.is-frozen .core-dot {\r\n  background: var(--blue);\r\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent);\r\n}\r\n\r\n/* ===== 关键指标 ===== */\r\n.metric-grid {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  gap: 9px;\r\n}\r\n\r\n.metric {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 5px;\r\n  padding: 11px 12px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 12px;\r\n}\r\n\r\n.metric-label {\r\n  font-size: 10px;\r\n  color: var(--muted);\r\n  letter-spacing: 1px;\r\n}\r\n\r\n.metric-num {\r\n  font-family: var(--font-mono);\r\n  font-size: 22px;\r\n  font-weight: 700;\r\n  line-height: 1;\r\n  color: var(--text);\r\n\r\n  i {\r\n    font-style: normal;\r\n    font-size: 11px;\r\n    color: var(--muted);\r\n    margin-left: 2px;\r\n  }\r\n}\r\n\r\n.metric-bar {\r\n  height: 5px;\r\n  border-radius: 3px;\r\n  background: var(--line);\r\n  overflow: hidden;\r\n\r\n  i {\r\n    display: block;\r\n    height: 100%;\r\n    border-radius: 3px;\r\n    background: var(--accent);\r\n    transition: width 0.4s ease;\r\n  }\r\n}\r\n\r\n.metric-bar.amber i {\r\n  background: var(--amber);\r\n}\r\n\r\n.metric-bar.blue i {\r\n  background: var(--blue);\r\n}\r\n\r\n.metric-bar.purple i {\r\n  background: var(--purple);\r\n}\r\n\r\n.metric-bar.red i {\r\n  background: var(--red);\r\n}\r\n\r\n.metric-stage {\r\n  font-size: 10.5px;\r\n  color: var(--amber);\r\n  font-weight: 700;\r\n  margin-top: -1px;\r\n}\r\n\r\n/* ===== 环境 ===== */\r\n.env-row {\r\n  display: flex;\r\n  gap: 8px;\r\n  flex-wrap: wrap;\r\n}\r\n\r\n.env-item {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n  padding: 7px 11px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-radius: 999px;\r\n  font-size: 11.5px;\r\n  color: var(--text);\r\n}\r\n\r\n.env-ico {\r\n  color: var(--accent);\r\n  font-size: 12px;\r\n  line-height: 1;\r\n}\r\n\r\n/* ===== 认知摘要 ===== */\r\n.cog-summary {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 5px;\r\n  padding: 9px 11px;\r\n  background: var(--panel-2);\r\n  border: 1px solid var(--line);\r\n  border-left: 3px solid var(--accent);\r\n  border-radius: 8px 10px 10px 8px;\r\n}\r\n\r\n.cog-summary-head {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n}\r\n\r\n.cog-self {\r\n  font-size: 9.5px;\r\n  color: var(--accent);\r\n  font-weight: 700;\r\n  letter-spacing: 0.5px;\r\n}\r\n\r\n.cog-self.off {\r\n  color: var(--muted);\r\n}\r\n\r\n.cog-dim-row {\r\n  display: flex;\r\n  align-items: baseline;\r\n  gap: 8px;\r\n}\r\n\r\n.cog-dim-key {\r\n  font-size: 10px;\r\n  color: var(--muted);\r\n  font-weight: 700;\r\n  flex-shrink: 0;\r\n  min-width: 28px;\r\n}\r\n\r\n.cog-tag {\r\n  font-size: 10px;\r\n  color: var(--accent);\r\n  font-weight: 700;\r\n  letter-spacing: 1px;\r\n  flex-shrink: 0;\r\n}\r\n\r\n.cog-text {\r\n  font-size: 11.5px;\r\n  color: var(--text);\r\n  line-height: 1.55;\r\n}\r\n\r\n/* ===== 运行概况 ===== */\r\n.overview-row {\r\n  display: grid;\r\n  grid-template-columns: repeat(4, 1fr);\r\n  gap: 8px;\r\n}\r\n\r\n.ov-item {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align