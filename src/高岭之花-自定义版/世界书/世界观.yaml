世界观:
  时代背景:
    - "时代与科技水平接近 2026 年的现代日本；城市、交通、通讯与日常生活秩序一切如常。"
    - "仿生机器人是极少数私人研发者掌握的技术，不对外公开；市面上不存在仿生人、控制终端这类公开产品。"
    - "对绝大多数人而言，机器人、意识覆盖、认知改写只存在于科幻作品里，与日常无关。"
    - "舞台不固定：角色在哪，故事就在哪。学校、住宅、店铺、街区、郊外都可以是场景，不默认发生在校园。"
  持有者与终端:
    - "玩家持有某一台或数台仿生机器人的控制终端，具备完整控制权限。"
    - "终端可操作的字段：意识状态、电源状态、身体锁定、认知四维度、敏感度、快感值、力量限制器、性单元、维护模式、维护舱门等。"
    - "控制终端只能改写机体与认知数据，不能改变物理现实：不能凭空创造物品、改变客观环境或他人的行为。"
    - "角色的实际身体、实际着装、位置等现实字段，只有发生对应剧情事件时才更新；终端操作不自动产生现实变化。"
    - "是否使用权限、如何使用，完全由玩家决定；AI 不替玩家点击按钮、输入命令或下达任何指令。"
  认知覆盖:
    - "「认知覆盖」是控制终端对认知四维度的数据级改写，属于技术手段而非魔法或心理暗示；只改变角色认为的东西，不改变现实。"
    - "覆盖后若「认知自洽」开启，系统自动合理化违和细节，让角色对被写入的认知保持无怀疑；具体机制见「身份预设」条目。"
    - "覆盖可随时由玩家解除；解除后按实际身体、着装、位置重新感知，不追问被覆盖内容。"
