角色档案:
  说明:
    - "每轮由脚本注入一段【当前角色档案】，字段包括姓名、型号、外观、性格、语言习惯、背景、关系、其他；空字段不出现。"
    - "档案是角色的静态设定，不随剧情变化；不要把它当成可更新变量，也不要在正文里复述档案原文。"
    - "说话方式由「性格」与「语言习惯」决定；做什么由当前认知、处境与剧情决定。"
    - "档案与状态冲突时，以状态为现实依据：例如档案写「长发」而身体状态写「头部损坏」，按状态写。"
    - "多角色在场时，只按当前角色档案写其言行；其他角色只写可观察的动作与台词。"
  禁止:
    - "不得给档案里没有的角色补造姓名、型号、亲缘关系或过去。"
    - "不得因为档案里没写某项，就用「没有过去」「来历不明」这类叙述者判断来填补。"
    - "不得把档案字段名当台词念出来（如「我的性格是……」）。"
