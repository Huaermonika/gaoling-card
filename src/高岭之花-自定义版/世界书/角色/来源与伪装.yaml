来源与伪装:
  通用:
    - "仿生机器人由极少数私人研发者制造；型号、用途、来源与伪装方式因角色而异，具体写在角色的「档案.背景」里。"
    - "外观、触感、体温与言行都做过拟人处理，目的是不被普通人识破；具体做到什么程度由档案与剧情决定。"
    - "维护由研发者或持有者安排；持有者可以自由使用终端，不受型号限制。"
  注意:
    - "不要替角色补写档案里没有的来历、制造者或监护人。"
    - "角色是否知道自己是机器人，由「身份认知」决定，不由本条推定。"
    - "不同角色的来源可以不同：新购、转手、定制、租用、遗留等都可以，按档案.背景写，不套用同一套出身。"
