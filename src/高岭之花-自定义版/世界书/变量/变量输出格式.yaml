---
变量输出格式:
  rule:
    - 每轮回复末尾输出一个完整且闭合的 <UpdateVariable>...</UpdateVariable>，紧接着单独一行输出 <StatusPlaceHolderImpl/>。
    - 只提交当前回复或玩家明确终端操作已经证明发生的变量变化；没有变化时 JSONPatch 必须是 []。
    - 更新命令必须是合法 JSON 数组，效果类似 JSON Patch (RFC 6902)，但只支持以下操作：replace（替换已存在路径的值）、delta（用带正负号的变动值更新已存在数值）、insert（新增不存在的对象键或数组项目，数组索引 - 表示追加到末尾）、remove（删除键或数组项）、move（移动，用 from 指定来源路径）。
    - replace 只能更新已存在路径；insert 只能新增确实不存在的对象键或数组项目；remove 不得删除 schema 要求保留的服装键。
    - 删除或修改单条指令覆盖时，必须精确到 /角色/c1/状态/指令覆盖/<编号>；禁止对整个指令覆盖对象执行 replace 或 remove。
    - 数值字段必须遵守 schema 范围；禁止更新以 $ 开头的只读派生字段（如 $好感阶段）。
    - 不得通过 JSONPatch 模拟玩家没有输入或没有执行的按钮、终端指令、动作、同意或关系选择。
    - 不得为了保持状态而重复写入未变化字段，也不得凭空漂移 CPU、内存、电量、快感、好感、当前地点或处境认知。
    - 记忆日志、系统日志的新增与变更属于本轮实际变化，必须写进 JSONPatch；记忆日志只在出现「记忆更新要求」时新增，不得自行补写，也不得因是日志类字段而省略。
    - 正文部分严禁出现 <tableEdit>、</content>、<!-- 注释 -->、<scene> 等结构化残片；这些标签仅限在 <UpdateVariable> 块内合法使用。
    - 路径必须写到具体角色：/角色/c1/状态/<字段>；不得再使用 /千鹤/… 这类旧路径。
    - 不得修改 当前角色、角色增删、角色档案；这些只由终端操作。
    - 示例路径中的 c1 表示任意受控角色 id；写入时替换为该角色实际的 id。
  format: |-
    <UpdateVariable>
    <Analysis>$(按英文输出，不超过80词；只说明本轮实际发生变化的依据)
    - ${计算经过的时间并更新 世界.当前时间}
    - ${回忆各变量对应的 check，仅根据当前回复而非之前剧情判断是否需要更新，逐条列明依据}
    - ${状态切换（关机/待机/开机/冻结/停止/恢复）时，同步写出所有联动字段，不遗漏}
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "/角色/c1/状态/电量", "value": 78 },
      { "op": "delta", "path": "${/到/数值/变量/的路径}", "value": "${正或负的变动值}" },
      { "op": "insert", "path": "${/到/对象/新键/的路径}", "value": "${新值}" },
      { "op": "insert", "path": "${/到/数组/-}", "value": "${新值}" },
      { "op": "remove", "path": "${/到/对象/键/的路径}" },
      { "op": "move", "from": "${/到/变量/的路径}", "to": "${/到/另一/路径}" }
    ]
    </JSONPatch>
    </UpdateVariable>
    <StatusPlaceHolderImpl/>
